# An Apache virtual host for the API alone, for a machine that would rather run
# XAMPP's Apache than `php -S localhost:8000 router.php`. Development only:
# build-dist.php leaves this file out. Replace the path with where your checkout
# is - Apache wants it absolute, and nobody's is the same.
Listen 8000

<VirtualHost *:8000>
    DocumentRoot "C:/path/to/anotoki-genshin-impact/backend/api"
    <Directory "C:/path/to/anotoki-genshin-impact/backend/api">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
