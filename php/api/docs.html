<!doctype html>
<!--
  Swagger UI over openapi.json, which sits beside this file.

  Both are in the API's own document root, so this page and the endpoints it
  describes are the same origin - which is what makes "Try it out" work without
  going anywhere near the CORS allowlist. Sign in through POST /api/auth/login,
  put the token into Authorize, and the rest of the API is reachable from here.

  openapi.json is generated; see angular/generate-openapi.mjs. This page is not.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>API reference</title>

    <link rel="icon" href="../../favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
      integrity="sha384-wxLW6kwyHktdDGr6Pv1zgm/VGJh99lfUbzSn6HNHBENZlCN7W602k9VkGdxuFvPn"
      crossorigin="anonymous"
    />

    <style>
      body {
        margin: 0;
        background: #fafafa;
      }

      /* The generated description is the only place that says where this came
         from, so it is worth reading rather than skimming past. */
      .swagger-ui .info .description {
        max-width: 46rem;
      }
    </style>
  </head>

  <body>
    <div id="swagger"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"
      integrity="sha384-wmyclcVGX/WhUkdkATwhaK1X1JtiNrr2EoYJ+diV3vj4v6OC5yCeSu+yW13SYJep"
      crossorigin="anonymous"
    ></script>

    <script>
      window.SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger',
        deepLinking: true,
        // 346 operations: collapsed, or the page opens as a wall.
        docExpansion: 'none',
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        defaultModelsExpandDepth: 0,
        tagsSorter: 'alpha',
        operationsSorter: 'alpha',
      });
    </script>
  </body>
</html>
