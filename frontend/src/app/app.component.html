<!-- The pages as a marked template: made only while the site is open, so none runs behind the status page.
     The marker is what makes it the pages (@anotoki/lib 0.2.0): without it the gate draws nothing. -->
<anotoki-site-gate>
    <ng-template anotokiSitePages>
        <router-outlet></router-outlet>
    </ng-template>
</anotoki-site-gate>
