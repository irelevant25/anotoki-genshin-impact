@if (!hidden()) {
    <div class="form-field" [class]="class()">
        <span class="form-label" [id]="inputId + '-label'">{{ kitLabel() }}</span>

        <!-- Named by the label and what is chosen, so a screen reader hears both. -->
        <button
            type="button"
            class="form-control multiselect-trigger"
            [id]="inputId"
            [anotokiPopoverTrigger]="choices"
            [attr.aria-labelledby]="inputId + '-label ' + inputId + '-value'"
            [attr.aria-describedby]="kitError() ? inputId + '-error' : kitHint() ? inputId + '-hint' : null"
            [attr.aria-invalid]="kitError() ? 'true' : null"
            [class.error]="!!kitError()"
            [disabled]="disabled()"
            (blur)="onBlur()">
            <span class="multiselect-value" [id]="inputId + '-value'" [class.placeholder]="!selectedOptions().length">{{ displayValue() || placeholder() || "—" }}</span>
            @if (selectedOptions().length) {
                <span class="selection-count" aria-hidden="true">{{ selectedOptions().length }}</span>
            }
        </button>

        <anotoki-popover #choices [label]="label() || placeholder() || 'Choose'">
            <div class="multiselect-options">
                @for (option of computedOptions(); track option.key) {
                    <anotoki-checkbox [checked]="isSelected(option)" (checkedChange)="toggleOption(option, $event)">{{ option.value }}</anotoki-checkbox>
                } @empty {
                    <p class="no-options">Nothing to choose from</p>
                }
            </div>
            @if (selectedOptions().length) {
                <button anotokiButton variant="link" size="sm" class="multiselect-clear" (click)="clear()">Clear</button>
            }
        </anotoki-popover>

        @if (kitHint() && !kitError()) {
            <p class="form-description" [id]="inputId + '-hint'">{{ kitHint() }}</p>
        }
        @if (kitError(); as error) {
            <p class="error-message" [id]="inputId + '-error'" role="alert">{{ error }}</p>
        }
    </div>
}
