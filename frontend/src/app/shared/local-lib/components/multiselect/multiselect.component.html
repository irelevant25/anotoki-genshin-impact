@if (!hidden()) {
    <div class="form-field" [class]="class()">
        @if (label()) {
            <label #labelElement [for]="inputId" class="form-label" [class.required]="required()">
                @if (tooltipText()) {
                    <i #tooltipElement class="icon icon-info" (mouseenter)="mouseEnter()" (mouseleave)="mouseLeave()"></i>
                }
                {{ label() }}
                @if (required()) {
                    <span class="required-indicator">*</span>
                }
            </label>
        }

        <div class="multiselect">
            <input
                #inputElement
                scroll
                [id]="inputId"
                [value]="displayValue()"
                [placeholder]="placeholder() ?? ''"
                [disabled]="disabled()"
                class="form-control cursor-default"
                [class.placeholder]="selectedOptions().length === 0"
                [class.error]="hasError()"
                [class.valid]="(validators().length || required()) && (!isNullOrEmpty() || isTouched()) && !hasError()"
                (keydown)="onKeyDown($event)"
                (click)="togglePopup()"
                (blur)="onBlur()"
                (focus)="onFocus()"
                readonly />
            <span class="multiselect-arrow" [class.down]="!isPopupOpen" [class.up]="isPopupOpen"></span>
            @if (selectedOptions().length > 0) {
                <span class="selection-count">{{ selectedOptions().length }}</span>
            }
        </div>

        @if (showBadges()) {
            <div class="badge-wrapper mt-2">
                @for (option of selectedOptions(); let i = $index; track option) {
                    <span class="badge padding-small text-small fw-400" [style.background-color]="'var(--color-primary-light)'" [style.color]="'var(--color-primary-light-text)'">
                        {{ option.value }}
                        <i class="icon icon-x icon-size-2 ms-2 cursor-pointer badge-remove" (click)="removeSelectedOption(i)"></i>
                    </span>
                }
            </div>
        }

        @if (displayError() && hasError()) {
            <div class="error-message" [id]="inputId + '-error'" role="alert" aria-live="polite">
                {{ errorMessage() }}
            </div>
        }
    </div>
}
