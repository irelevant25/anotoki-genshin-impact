@if (!hidden()) {
    <anotoki-textarea
        [class]="class()"
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [value]="text()"
        [rows]="rows()"
        [placeholder]="placeholder() ?? ''"
        [hint]="kitHint()"
        [error]="kitError()"
        [required]="required()"
        [disabled]="disabled()"
        [maxlength]="maxLength() ?? null"
        (valueChange)="onKitInput($event)"
        (focusout)="onBlur()" />
}
