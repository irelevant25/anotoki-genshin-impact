<div class="audio-player" [class.error]="error()">
    <audio
        #audioElement
        [src]="src()"
        [autoplay]="autoplay()"
        preload="metadata"
        (loadedmetadata)="onLoadedMetadata()"
        (timeupdate)="onTimeUpdate()"
        (play)="playing.set(true)"
        (pause)="playing.set(false)"
        (ended)="playing.set(false)"
        (error)="error.set(true)"></audio>

    @if (label()) {
        <span class="audio-label" [title]="label()">{{ label() }}</span>
    }

    @if (error()) {
        <span class="audio-error">This file could not be played.</span>
    } @else {
        <div class="audio-controls">
            <button anotokiButton size="sm" iconOnly [attr.aria-label]="playing() ? 'Pause' : 'Play'" [anotokiTooltip]="playing() ? 'Pause' : 'Play'" (click)="togglePlay()">
                <span [class]="'icon ' + (playing() ? 'icon-pause' : 'icon-play')" aria-hidden="true"></span>
            </button>
            <button anotokiButton variant="ghost" size="sm" iconOnly aria-label="Stop" anotokiTooltip="Stop" (click)="stop()"><span class="icon icon-stop" aria-hidden="true"></span></button>

            <span class="audio-time">{{ elapsedLabel() }}</span>
            <input class="audio-seek" type="range" min="0" max="100" step="0.1" [value]="progress()" [disabled]="duration() <= 0" aria-label="Seek" (input)="onSeek($event)" />
            <span class="audio-time">{{ durationLabel() }}</span>
        </div>
    }
</div>
