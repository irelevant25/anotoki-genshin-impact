@if (!hidden()) {
    <anotoki-text-field
        [class]="class()"
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [value]="text()"
        [inputmode]="allowDecimal() ? 'decimal' : 'numeric'"
        [placeholder]="placeholder() ?? ''"
        [hint]="kitHint()"
        [error]="shownError()"
        [required]="required()"
        [disabled]="disabled()"
        (valueChange)="onKitInput($event)"
        (blurred)="onBlur()" />
}
