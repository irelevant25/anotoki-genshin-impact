@if (!hidden()) {
    <anotoki-date-field
        [class]="class()"
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [value]="fieldValue()"
        [format]="format()"
        [dayMonth]="hideYear()"
        [placeholder]="placeholder() ?? ''"
        [hint]="kitHint()"
        [error]="kitError()"
        [required]="required()"
        [disabled]="disabled()"
        (valueChange)="onKitValue($event)"
        (blurred)="onBlur()" />
}
