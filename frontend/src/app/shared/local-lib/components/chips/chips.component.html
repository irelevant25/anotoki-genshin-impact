@if (!hidden()) {
    <anotoki-chip-group
        [class]="class()"
        multiple
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [options]="chipOptions()"
        [values]="chosen()"
        [hint]="kitHint()"
        [error]="kitError()"
        [required]="required()"
        [disabled]="disabled()"
        (valuesChange)="onChosen($event)" />
}
