@if (!hidden()) {
    <div class="form-field" [class]="class()">
        @if (label()) {
            <!-- Names the button with it (aria-labelledby): "Audio file, Choose a file". -->
            <span class="form-label" [id]="inputId + '-label'" [class.required]="required()">
                {{ label() }}
                @if (required()) {
                    <span class="required-indicator">*</span>
                }
            </span>
        }

        @if (description()) {
            <span class="form-description" [id]="inputId + '-hint'">{{ description() }}</span>
        }

        <!-- The device's chooser, opened by the button below; nothing here to tab to. -->
        <input
            #inputElement
            type="file"
            class="file-input"
            tabindex="-1"
            aria-hidden="true"
            [multiple]="multiple()"
            [accept]="acceptAttribute"
            [disabled]="disabled()"
            (change)="onFileChange($event)" />

        <button
            anotokiButton
            [id]="inputId"
            [variant]="kitVariant()"
            [disabled]="disabled()"
            [attr.aria-labelledby]="label() ? inputId + '-label ' + inputId : null"
            [attr.aria-describedby]="displayError() && hasError() ? inputId + '-error' : description() ? inputId + '-hint' : null"
            (click)="onButtonClick()"
            (blur)="onBlur()"
            (focus)="onFocus()">
            {{ buttonWords() }}
        </button>

        @if (displayError() && hasError()) {
            <div class="error-message" [id]="inputId + '-error'" role="alert" aria-live="polite">
                {{ errorMessage() }}
            </div>
        }
    </div>
}
