@if (!hidden()) {
    <anotoki-select
        [class]="class()"
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [options]="kitOptions()"
        [value]="kitValue()"
        [placeholder]="emptyOption() ? (emptyOptionText() ?? placeholder() ?? '') : null"
        [hint]="kitHint()"
        [error]="kitError()"
        [required]="required()"
        [disabled]="disabled()"
        (valueChange)="onKitChange($event)"
        (focusout)="onBlur()" />
}
