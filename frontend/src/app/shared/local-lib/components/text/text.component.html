@if (!hidden()) {
    <anotoki-text-field
        [class]="class()"
        [label]="kitLabel()"
        [hideLabel]="!label()"
        [value]="text()"
        [placeholder]="placeholder() ?? ''"
        [hint]="kitHint()"
        [error]="kitError()"
        [required]="required()"
        [disabled]="disabled()"
        [maxlength]="maxLength() ?? null"
        [autocomplete]="autocomplete() ?? ''"
        (valueChange)="onKitInput($event)"
        (blurred)="onBlur()" />
}
