<button
    anotokiButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    [anotokiTooltip]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggle()">
    <anotoki-icon [name]="theme.isDarkMode() ? 'sun' : 'moon'" [size]="18" />
</button>
