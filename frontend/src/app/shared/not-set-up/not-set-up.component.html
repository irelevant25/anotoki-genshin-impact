<!-- The words are the kept translations or the built-in English, so the panel
     says which language it is in rather than trusting the document's. -->
<main class="not-set-up" [attr.lang]="language()">
    <div class="not-set-up-panel">
        <span class="icon icon-gear icon-size-6 not-set-up-mark" aria-hidden="true"></span>

        <h1>{{ title() }}</h1>
        <p>{{ text() }}</p>

        <p class="not-set-up-operator">{{ operator() }}</p>
        <a class="not-set-up-action" [href]="setupUrl()">{{ setup() }}</a>
    </div>
</main>
