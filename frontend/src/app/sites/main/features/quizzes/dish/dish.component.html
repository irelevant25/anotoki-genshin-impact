<div class="container w-100">
    <app-loader #loader [loading]="loading()"></app-loader>

    @if (!loader.loadingCtrl.loading()) {
        <app-quiz-frame
            [quizId]="quizId"
            [difficulty]="difficulty()"
            [chosenDifficulty]="chosenDifficulty()"
            [isDaily]="isDaily()"
            [isQuestionComplete]="isQuestionComplete()"
            [tries]="displayTries()"
            [triesCount]="tries().length"
            [triesMax]="triesMax()"
            [options]="searchOptions()"
            [answer]="questionEntity()"
            (guess)="guess($event)"
            (next)="next()"
            (chooseDifficulty)="chooseDifficulty($event)">
            @if (questionEntity()?.dish; as dish) {
                <div class="dish">
                    <!-- The dish's own picture: its normal icon, the path the foods list
                         answers (icon_normal) - never a file named after the dish. -->
                    <img class="quiz-question-image" [class]="effectClasses()" [appMaterialIcon]="dish.icon_normal" alt="" loading="eager" />

                    @if (isQuestionComplete()) {
                        <p class="dish-name">{{ dish.name }}</p>
                    }
                </div>
            }
        </app-quiz-frame>
    }
</div>
