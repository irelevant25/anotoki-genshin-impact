<div class="container w-100">
    <app-loader #loader [loading]="loading()"></app-loader>

    @if (!loader.loadingCtrl.loading()) {
        <app-quiz-frame
            [difficulty]="difficultyString()"
            [isDaily]="isDaily()"
            [isQuestionComplete]="isQuestionComplete()"
            [tries]="displayTries()"
            [triesCount]="tries().length"
            [triesMax]="triesMax()"
            [options]="searchOptions()"
            [answer]="questionEntity()"
            (guess)="guess($event)"
            (next)="next()">
            @if (questionEntity(); as character) {
                <img
                    class="quiz-question-image"
                    [class]="effectClasses()"
                    [appMaterialIcon]="character.namecard_banner_name ?? character.name"
                    [appAssetFolder]="'character.namecard_banner'"
                    alt=""
                    loading="eager" />
            }
        </app-quiz-frame>
    }
</div>
