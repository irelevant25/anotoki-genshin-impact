<div class="container w-100">
    <app-loader #loader [loading]="loading()"></app-loader>

    @if (!loader.loadingCtrl.loading()) {
        <app-quiz-frame
            [quizId]="quizId"
            [difficulty]="difficulty()"
            [chosenDifficulty]="chosenDifficulty()"
            [isDaily]="isDaily()"
            [isQuestionComplete]="isQuestionComplete()"
            [tries]="displayTries()"
            [triesCount]="tries().length"
            [triesMax]="triesMax()"
            [options]="searchOptions()"
            [answer]="questionEntity()"
            (guess)="guess($event)"
            (next)="next()"
            (chooseDifficulty)="chooseDifficulty($event)">
            <app-quiz-audio-player [src]="trackUrl()" [limit]="limit()"></app-quiz-audio-player>

            @if (isQuestionComplete() && questionEntity(); as character) {
                <p class="track-name">{{ character.demo_music_name }}</p>
            }
        </app-quiz-frame>
    }
</div>
