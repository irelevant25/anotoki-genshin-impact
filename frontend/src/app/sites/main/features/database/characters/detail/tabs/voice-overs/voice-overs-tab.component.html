<div id="voice-overs" class="voiceover-container">
    <div class="voiceover-filters">
        <anotoki-segmented [label]="'database.detail.language' | translate" [options]="languageOptions" [value]="language()" (valueChange)="language.set($event)" size="sm" />
        <anotoki-segmented [label]="'database.detail.type' | translate" [options]="typeOptions()" [value]="type()" (valueChange)="pickType($event)" size="sm" />
    </div>

    <div class="voicelines-container">
        @for (line of lines(); track line.id) {
            <div class="voiceline-card">
                <div class="voiceline-header">
                    <div class="voiceline-title">{{ line.title }}</div>
                    <div [class]="type() + '-badge'">{{ "database.detail." + type() | translate }}</div>
                </div>
                <div class="voiceline-content">
                    <!-- A dialogue's text carries its speakers in <b>; rendered through the sanitising component. -->
                    <app-rich-text class="voiceline-text" [html]="line.text"></app-rich-text>
                    @if (line.audio) {
                        <div class="audio-container">
                            <audio preload="none" controls [src]="line.audio"></audio>
                        </div>
                    }
                </div>
            </div>
        } @empty {
            <div class="empty-state">{{ "database.detail.noVoiceLines" | translate }}</div>
        }
    </div>
</div>
