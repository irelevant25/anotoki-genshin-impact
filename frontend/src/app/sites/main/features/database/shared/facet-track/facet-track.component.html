<span class="facet-label" [id]="labelId">{{ label() }}</span>
<div class="track" role="group" [class.track--wide]="wide()" [class.track--chosen]="value() !== null" [attr.aria-labelledby]="labelId">
    @if (allLabel(); as all) {
        <button type="button" class="seg seg--wide seg--words" [class.seg--on]="value() === null" [attr.aria-pressed]="value() === null" (click)="value.set(null)">
            {{ all }}
            <span class="seg-count">{{ allTotal() }}</span>
        </button>
    }
    @for (option of options(); track option.value) {
        <button
            type="button"
            class="seg"
            [class.seg--wide]="wide()"
            [class.seg--words]="showsWords(option)"
            [class.seg--on]="value() === option.value"
            [style.--ring]="option.ring ?? null"
            [style.--ink]="option.ink ?? null"
            [style.--star]="option.star ?? null"
            [attr.aria-pressed]="value() === option.value"
            [attr.aria-label]="showsWords(option) ? null : option.label"
            [attr.title]="showsWords(option) ? null : option.label"
            (click)="choose(option.value)">
            @if (option.picture; as picture) {
                <img [appMaterialIcon]="picture.name" [appAssetFolder]="picture.folder" alt="" />
            }
            @if (option.stars) {
                <span class="seg-stars" aria-hidden="true">{{ stars(option.stars) }}</span>
            }
            @if (showsWords(option)) {
                {{ option.label }}
            }
            @if (option.star) {
                <span class="seg-star" aria-hidden="true">★</span>
            }
            @if (option.count !== undefined) {
                <span class="seg-count">{{ option.count }}</span>
            }
        </button>
    }
</div>
