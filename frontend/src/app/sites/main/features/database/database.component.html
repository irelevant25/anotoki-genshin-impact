<div class="container d-flex flex-wrap justify-content-center gap-5 text-align-center">
    @for (item of DATABASE; track item.path) {
        <!-- A link, as the Quizzes and Games cards are: the keyboard reaches it and Enter opens it. The picture says
             nothing the title does not, so it has no words of its own. -->
        <a class="card px-5 pb-5" [routerLink]="item.path">
            <img [src]="item.cardImage" alt="" loading="lazy" />
            <div class="card-body">
                <h3 class="card-title">{{ item.title | translate }}</h3>
                <p class="card-text">{{ item.cardInfo | translate }}</p>
            </div>
        </a>
    }
</div>
