<!-- Instead of the site rather than over it: while the IAM requires sign-in here, every link would answer 401 to
     somebody signed out. (The site closed for maintenance is the root gate's: the library's closed sign stands
     alone, with no header and no footer, for everybody but this site's ADMIN.) -->
@if (signInFirst()) {
    <app-sign-in-required></app-sign-in-required>
} @else {
    <!-- The administrators' announcement, above the header: the site talking, not navigation
         (@anotoki/lib/site-settings). -->
    <anotoki-announcement />

    <app-header></app-header>

    <!-- Above the page and below the menu: what this site's ADMIN alone reads about the page - the site closed, this
         page switched off, or kept for some readers (the library's). -->
    <anotoki-page-notice />

    <router-outlet></router-outlet>
}

<!-- Under every page. The sign-in card - which the legal pages, About and Support stand in place of - keeps the fan
     clause and About · Support · Terms · Privacy · Contact alone: the site's own dialogs would ask an API that refuses
     them. -->
<app-footer [legalOnly]="signInFirst()" />

<!-- Outside both, because a toast is about what just happened rather than about
     which page it happened on: the kit's, in a polite live region. -->
<anotoki-toast-host />
