<!-- Instead of the site rather than over it: a closed sign with a working menu
     behind it invites somebody to go round it, and every link would answer 503
     anyway. -->
@if (closed()) {
    <app-maintenance></app-maintenance>
} @else if (signInFirst()) {
    <!-- For the same reason: while the IAM requires sign-in here, every link
         would answer 401 to somebody signed out. -->
    <app-sign-in-required></app-sign-in-required>
} @else {
    <app-announcement></app-announcement>

    <app-header></app-header>

    <!-- Above the page and below the menu: it is about this page rather
         than about the site, and only an admin ever gets one. -->
    <app-route-notice></app-route-notice>

    <router-outlet></router-outlet>

    <app-footer></app-footer>
}

<!-- Outside both, because a notification is about what just happened rather
     than about which page it happened on. -->
<app-notification></app-notification>
