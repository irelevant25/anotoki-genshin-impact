<div class="failure" role="alert">
    <p class="failure-reason">{{ reasonKey() | translate }}</p>

    @if (code(); as code) {
        <p class="failure-code">{{ 'auth.callback.code' | translate: { code: code } }}</p>
    }

    <div class="failure-actions">
        <app-button [text]="'auth.callback.back' | translate" variant="secondary" [outline]="true" (buttonClick)="back()"></app-button>
        @if (canRetry()) {
            <app-button [text]="'auth.callback.retry' | translate" variant="primary" (buttonClick)="retry()"></app-button>
        }
    </div>
</div>
