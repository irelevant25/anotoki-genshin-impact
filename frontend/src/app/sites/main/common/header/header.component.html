<nav>
    <ul>
        @for (menuItem of menuItems(); track menuItem.id) {
            <li>
                <!-- How much of today's daily is left, and green once it is
                     none. A count says what a question mark could not: whether
                     it is worth going in. -->
                @if (menuItem.daily) {
                    <span
                        class="daily-badge"
                        [class.daily-badge-done]="daily.allDone()"
                        [title]="(daily.allDone() ? 'nav.dailyDone' : 'nav.dailyRemaining') | translate: { count: daily.remaining() }"
                    >{{ daily.remaining() }}</span>
                }
                @if (menuItem.guide) {
                    <app-guide-icon class="help-icon right" [guide]="menuItem.guide"></app-guide-icon>
                }
                <!-- Only an admin ever sees this, because only an admin ever
                     gets an item nobody else would. Without it the menu looks
                     identical whatever they have just switched off. -->
                @if (menuItem.hidden) {
                    <span class="hidden-badge">{{ 'route.hiddenBadge' | translate }}</span>
                }
                <a [routerLink]="menuItem.id" [class.nav-hidden]="menuItem.hidden">{{ menuItem.title | translate }}</a>
            </li>
        }
    </ul>
</nav>
