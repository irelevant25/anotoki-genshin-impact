<!-- Opened from the account panel's Background row: what choosing one does is all it needs to say. -->
<p class="backgrounds-intro">{{ "backgrounds.whatText" | translate }}</p>

<div class="background-grid">
    @for (item of BACKGROUNDS; track item.wallpaper) {
        <!-- A button holding the picture, so the keyboard can choose one too. -->
        <button type="button" class="background-thumbnail" [title]="item.name" (click)="changeBackground(item)">
            <img loading="lazy" [src]="item.preview" [alt]="item.name" />
        </button>
    }
</div>
