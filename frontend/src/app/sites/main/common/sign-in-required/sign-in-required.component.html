<div class="container w-100">
    <div class="sign-in-required">
        <span class="sign-in-required-mark icon icon-user" aria-hidden="true"></span>

        <h1>{{ 'site.signInRequired.title' | translate }}</h1>

        <p class="sign-in-required-text">{{ 'site.signInRequired.text' | translate }}</p>

        <!-- This browser played here as a visitor before sign-in became
             required: the key is kept, and signing in moves what it holds. -->
        @if (visitorKeyHeld()) {
            <p class="sign-in-required-text">{{ 'visitor.comesWith' | translate }}</p>
        }

        @if (signInFailure()) {
            <!-- The library's screen of a sign-in that did not work (@anotoki/lib/auth): why, Try again, Back. -->
            <anotoki-sign-in-failure></anotoki-sign-in-failure>
        } @else {
            <div class="sign-in-required-actions">
                <button anotokiButton variant="primary" [disabled]="!available()" (click)="signIn()">{{ 'common.signIn' | translate }}</button>
                <button anotokiButton [disabled]="!available()" (click)="createAccount()">{{ 'account.createAccount' | translate }}</button>
            </div>
        }
    </div>
</div>
