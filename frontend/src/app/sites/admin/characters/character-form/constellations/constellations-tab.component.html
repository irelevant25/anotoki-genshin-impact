<div class="set-toolbar">
    <button anotokiButton anotokiTooltip="Use another character's constellation set (for the Traveler's variants)" (click)="chooseSet()">
        <span class="icon icon-layers" aria-hidden="true"></span>
        Choose set
    </button>
    @if (deleteAllArmed()) {
        <button anotokiButton (click)="cancelDeleteAll()">Cancel</button>
        <button anotokiButton variant="danger" (click)="deleteAll()">{{ "Delete all " + constellations().length + "?" }}</button>
    } @else {
        <button anotokiButton variant="danger" [disabled]="!constellations().length" (click)="deleteAll()">Delete all</button>
    }
</div>

<div class="sub-list">
    @for (item of sorted(); track item.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">C{{ item.data.level }} · {{ item.data.name || "Unnamed" }}</span>
                <button anotokiButton variant="danger" (click)="removeConstellation(item)">Delete</button>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <anotoki-text-field
                        label="Level *"
                        required
                        [min]="1"
                        [max]="maxConstellations"
                        [appNumber]="item.data.level"
                        (appNumberChange)="onLevelChange(item, $event)"
                        #levelField="appNumber"
                        [value]="levelField.text()"
                        [inputmode]="levelField.inputmode()"
                        [error]="levelField.error()" />
                    <anotoki-text-field
                        label="Name *"
                        class="col-span-3"
                        required
                        appCheck
                        #nameField="appCheck"
                        [error]="nameField.error()"
                        [value]="fieldText(item.data.name)"
                        (valueChange)="item.data.name = $event" />
                </div>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <app-entity-image
                        [label]="'Icon'"
                        [required]="true"
                        [path]="iconPath(item)"
                        [name]="iconName(item)"
                        [pending]="item.pending"
                        (picked)="onPicked(item, $event)"
                        (cleared)="onCleared(item)" />
                    <anotoki-textarea label="Description" class="col-span-3" [rows]="4" [value]="fieldText(item.data.description)" (valueChange)="item.data.description = $event" />
                </div>
            </div>
        </div>
    }

    @if (canAdd()) {
        <button anotokiButton (click)="addConstellation()">Add</button>
    }
</div>
