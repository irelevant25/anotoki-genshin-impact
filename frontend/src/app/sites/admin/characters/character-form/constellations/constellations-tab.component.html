<div class="set-toolbar">
    <app-button
        text="Choose set"
        icon="icon-layers"
        variant="secondary"
        [outline]="true"
        tooltipText="Use another character's constellation set (for the Traveler's variants)"
        (buttonClick)="chooseSet()"
    ></app-button>
    @if (deleteAllArmed()) {
        <app-button text="Cancel" variant="secondary" [outline]="true" (buttonClick)="cancelDeleteAll()"></app-button>
        <app-button [text]="'Delete all ' + constellations().length + '?'" variant="danger" (buttonClick)="deleteAll()"></app-button>
    } @else {
        <app-button text="Delete all" variant="danger" [outline]="true" [disabled]="!constellations().length" (buttonClick)="deleteAll()"></app-button>
    }
</div>

<div class="sub-list">
    @for (item of sorted(); track item.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">C{{ item.data.level }} · {{ item.data.name || 'Unnamed' }}</span>
                <app-button variant="danger" [outline]="true" (buttonClick)="removeConstellation(item)">Delete</app-button>
            </div>
            <app-field-container [cols]="4">
                <app-number
                    [label]="'Level'"
                    [value]="item.data.level"
                    [required]="true"
                    [min]="1"
                    [max]="maxConstellations"
                    (inputChange)="onLevelChange(item, $event)"
                ></app-number>
                <app-text class="col-span-3" [label]="'Name'" [(value)]="item.data.name" [required]="true"></app-text>
            </app-field-container>
            <app-field-container [cols]="4">
                <app-entity-image
                        [label]="'Icon'"
                        [required]="true"
                        [path]="iconPath(item)"
                        [name]="iconName(item)"
                        [pending]="item.pending"
                        (picked)="onPicked(item, $event)"
                        (cleared)="onCleared(item)"
                    />
                <app-textarea class="col-span-3" [label]="'Description'" [(value)]="item.data.description" [rows]="4"></app-textarea>
            </app-field-container>
        </div>
    }

    @if (canAdd()) {
        <app-button variant="primary" [outline]="true" (buttonClick)="addConstellation()">Add</app-button>
    }
</div>
