<div class="vo-toolbar">
    <span class="vo-total">{{ voiceOvers().length }} voice overs</span>
    <div class="vo-toolbar-actions">
        <button anotokiButton anotokiTooltip="Use another character's voice-over set (for the Traveler's variants)" (click)="chooseSet()"><span class="icon icon-layers" aria-hidden="true"></span> Choose set</button>
        <button anotokiButton (click)="openImport()"><span class="icon icon-upload" aria-hidden="true"></span> Import from files</button>
        @if (deleteAllArmed()) {
            <button anotokiButton (click)="cancelDeleteAll()">Cancel</button>
            <button anotokiButton variant="danger" (click)="deleteAll()">{{ 'Delete all ' + voiceOvers().length + '?' }}</button>
        } @else {
            <button anotokiButton variant="danger" [disabled]="!voiceOvers().length" (click)="deleteAll()">Delete all</button>
        }
    </div>
</div>

<!-- The kit's accordion: each group's button a heading of the tab (its lines' headings under it); Up, Down, Home
     and End move between the groups' buttons, and between a group's lines' inside it. Many open at once. -->
<anotoki-accordion multiple class="vo-groups">
    @for (group of groups(); track group.type) {
        <div class="disclosure-group">
            <anotoki-disclosure [heading]="group.type + ' (' + group.entries.length + ')'" [headingLevel]="2">
                <!-- Only build a group's lines once it is opened; a set can hold hundreds. -->
                <ng-template anotokiDisclosurePanel>
                    <anotoki-accordion multiple>
                        @for (entry of group.entries; track entry.wrapper.uid) {
                            <anotoki-disclosure [heading]="entry.title" [headingLevel]="3">
                                <!-- And a line's four language editors only once that line is opened. -->
                                <ng-template anotokiDisclosurePanel>
                                    <!-- The disclosure draws the card around a line's editor. -->
                                    <div>
                                        <div class="sub-card-header">
                                            <anotoki-number-field
                                                label="Order *"
                                                required
                                                [min]="1"
                                                [max]="group.entries.length"
                                                [appNumber]="entry.wrapper.data.order"
                                                (appNumberChange)="onOrderChange(entry.wrapper, $event)"
                                                #orderField="appNumber"
                                                [value]="orderField.number()"
                                                [error]="orderField.error()"
                                            />
                                            <button anotokiButton variant="danger" (click)="removeVoiceOver(entry.wrapper)">Delete</button>
                                        </div>
                                        <anotoki-text-field label="Name" hint="The same in every language, e.g. Elemental Skill: I" [value]="fieldText(entry.wrapper.data.name)" (valueChange)="entry.wrapper.data.name = $event" />
                                        <!-- One language's editor at a time: the kit's tabs, which keep the one chosen. -->
                                        <anotoki-tabs #langTabs="anotokiTabs" label="Language" [tabs]="languageTabs" active="english" (activeChange)="stopAudio()" />
                                        <div class="language-panel" role="tabpanel" [id]="langTabs.panelId(langTabs.active())" [attr.aria-labelledby]="langTabs.tabId(langTabs.active())">
                                            <app-voice-overs-tab-item [entry]="entry.wrapper" [language]="$any(langTabs.active())" [(audio)]="audio" [(playingKey)]="playingKey" />
                                        </div>
                                    </div>
                                </ng-template>
                            </anotoki-disclosure>
                        }
                    </anotoki-accordion>
                </ng-template>
            </anotoki-disclosure>
            <div class="mt-2">
                <button anotokiButton (click)="addVoiceOver(group.type)">Add {{ group.type }}</button>
            </div>
        </div>
    }
</anotoki-accordion>
