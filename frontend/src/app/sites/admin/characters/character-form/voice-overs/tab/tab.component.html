<app-field-container [cols]="1">
    <app-field-container [cols]="1">
        <app-text [label]="'Title'" [(value)]="entry().data[titleKey()]"></app-text>
    </app-field-container>
    <app-field-container [cols]="1">
        <!-- Markup, not plain text: a dialogue keeps its speakers in <b>, which the site renders. -->
        <app-html-editor [label]="'Text'" [value]="text()" (valueChange)="onTextChange($event)" [minHeight]="'120px'" [displayError]="false"></app-html-editor>
    </app-field-container>
    <div class="audio-row">
        <app-file
            [label]="'Audio File'"
            [buttonOutline]="true"
            [acceptedExtensions]="audioExtensions"
            [fileNamePosition]="'right'"
            [showFileNames]="false"
            (inputChange)="onAudioSelect($event)"
        ></app-file>
        @if (audioLabel(); as label) {
            <div class="audio-preview">
                <button
                    anotokiButton
                    size="sm"
                    iconOnly
                    [attr.aria-label]="isPlaying() ? 'Stop' : 'Play'"
                    (click)="togglePlay()">
                    <span [class]="'icon ' + (isPlaying() ? 'icon-stop' : 'icon-play')" aria-hidden="true"></span>
                </button>
                <span class="audio-filename">{{ label }}</span>
            </div>
        }
    </div>
</app-field-container>
