<anotoki-page-header [heading]="character().data.name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()"><anotoki-icon name="arrowLeft" [size]="16" /> Back</a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <!-- The kit's tabs. Every panel stays in the page, hidden but for the one chosen: the
         save checks every field, and opens the tab holding the first wrong one. -->
    <anotoki-tabs #formTabs="anotokiTabs" label="Parts of the form" [tabs]="[{ id: 'base-info', label: 'Base Info' }, { id: 'voice-overs', label: 'Voice Overs' }, { id: 'constellations', label: 'Constellations' }, { id: 'ascensions', label: 'Ascensions' }, { id: 'talents', label: 'Talents' }]" active="base-info" />
    <div class="form-tab-panel" role="tabpanel" data-tab="base-info" [id]="formTabs.panelId('base-info')" [attr.aria-labelledby]="formTabs.tabId('base-info')" [hidden]="formTabs.active() !== 'base-info'">
        <app-base-info-tab
            [(character)]="character"
            [(relationships)]="relationships"
            [(selectedRoles)]="selectedRoles"
            [elements]="elements()"
            [weaponTypes]="weaponTypes()"
            [models]="models()"
            [rarities]="rarities()"
            [regions]="regions()"
            [relationshipTypes]="relationshipTypes()"
            [roles]="roles()"
            [characterStates]="characterStates()"
            [foods]="foods()"
        />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="voice-overs" [id]="formTabs.panelId('voice-overs')" [attr.aria-labelledby]="formTabs.tabId('voice-overs')" [hidden]="formTabs.active() !== 'voice-overs'">
        <app-voice-overs-tab
            [(voiceOvers)]="voiceOvers"
            [characterName]="character().data.name"
            [voiceOverSetId]="character().data.voice_over_set_id"
            (voiceOverSetChosen)="onVoiceOverSetChosen($event)" />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="constellations" [id]="formTabs.panelId('constellations')" [attr.aria-labelledby]="formTabs.tabId('constellations')" [hidden]="formTabs.active() !== 'constellations'">
        <app-constellations-tab
            [(constellations)]="constellations"
            [constellationSetId]="character().data.constellation_set_id"
            (constellationSetChosen)="onConstellationSetChosen($event)"
        />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="ascensions" [id]="formTabs.panelId('ascensions')" [attr.aria-labelledby]="formTabs.tabId('ascensions')" [hidden]="formTabs.active() !== 'ascensions'">
        <app-ascensions-tab
            [(ascensions)]="ascensions"
            [stats]="stats()"
            [materials]="materials()"
            [ascensionSetId]="character().data.ascension_set_id"
            (ascensionSetChosen)="onAscensionSetChosen($event)"
        />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="talents" [id]="formTabs.panelId('talents')" [attr.aria-labelledby]="formTabs.tabId('talents')" [hidden]="formTabs.active() !== 'talents'">
        <app-talents-tab
            [(talents)]="talents"
            [(talentCost)]="talentCost"
            [talentTypes]="talentTypes()"
            [materials]="materials()"
            [talentSetId]="character().data.talent_set_id"
            (talentSetChosen)="onTalentSetChosen($event)"
        />
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? 'Save Changes' : 'Create Character' }}</button>
    </div>
}
