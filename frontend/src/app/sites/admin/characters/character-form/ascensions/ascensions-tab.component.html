<div class="set-toolbar">
    <button anotokiButton anotokiTooltip="Use another character's ascension set (for the Traveler's variants)" (click)="chooseSet()">
        <span class="icon icon-layers" aria-hidden="true"></span>
        Choose set
    </button>
    @if (deleteAllArmed()) {
        <button anotokiButton (click)="cancelDeleteAll()">Cancel</button>
        <button anotokiButton variant="danger" (click)="deleteAll()">{{ "Delete all " + ascensions().length + "?" }}</button>
    } @else {
        <button anotokiButton variant="danger" [disabled]="!ascensions().length" (click)="deleteAll()">Delete all</button>
    }
</div>

<div class="sub-list">
    @for (item of sorted(); track item.wrapper.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">Phase {{ item.wrapper.ascension.phase }}</span>
                <button anotokiButton variant="danger" (click)="removeAscension(item.wrapper)">Delete</button>
            </div>
            <div class="form-grid">
                <anotoki-number-field
                    label="Phase *"
                    required
                    [min]="0"
                    [max]="maxPhase"
                    [(appNumber)]="item.wrapper.ascension.phase"
                    #phaseField="appNumber"
                    [value]="phaseField.number()"
                    [error]="phaseField.error()" />
                <anotoki-select
                    label="Primary Stat *"
                    required
                    placeholder="— select stat —"
                    [(appChoice)]="item.wrapper.ascension.primary_stat"
                    [choices]="stats()"
                    #primaryStatField="appChoice"
                    [options]="primaryStatField.options()"
                    [value]="primaryStatField.selected()"
                    [none]="null"
                    [error]="primaryStatField.error()" />
                <anotoki-number-field
                    label="Primary Stat Value"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.primary_stat_value"
                    #primaryStatValueField="appNumber"
                    [value]="primaryStatValueField.number()"
                    [error]="primaryStatValueField.error()" />
                <anotoki-number-field
                    label="Start HP"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.start_level_hp"
                    #startHpField="appNumber"
                    [value]="startHpField.number()"
                    [error]="startHpField.error()" />
                <anotoki-number-field
                    label="Start ATK"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.start_level_atk"
                    #startAtkField="appNumber"
                    [value]="startAtkField.number()"
                    [error]="startAtkField.error()" />
                <anotoki-number-field
                    label="Start DEF"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.start_level_def"
                    #startDefField="appNumber"
                    [value]="startDefField.number()"
                    [error]="startDefField.error()" />
                <anotoki-number-field
                    label="End HP"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.end_level_hp"
                    #endHpField="appNumber"
                    [value]="endHpField.number()"
                    [error]="endHpField.error()" />
                <anotoki-number-field
                    label="End ATK"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.end_level_atk"
                    #endAtkField="appNumber"
                    [value]="endAtkField.number()"
                    [error]="endAtkField.error()" />
                <anotoki-number-field
                    label="End DEF"
                    [step]="0.01"
                    [min]="0"
                    [(appNumber)]="item.wrapper.ascension.end_level_def"
                    #endDefField="appNumber"
                    [value]="endDefField.number()"
                    [error]="endDefField.error()" />
            </div>

            @if (item.wrapper.ascension.phase !== 0) {
                <div class="cost-section">
                    <div class="cost-header">
                        <span class="cost-label">Materials</span>
                        <button anotokiButton (click)="addCost(item.wrapper)">Add</button>
                    </div>
                    <div class="cost-cards">
                        @for (cost of item.cost; track cost) {
                            <div class="cost-card">
                                <anotoki-number-field
                                    label="Order *"
                                    required
                                    [min]="1"
                                    [max]="item.cost.length"
                                    [appNumber]="cost.order"
                                    (appNumberChange)="onCostOrderChange(item.wrapper, cost, $event)"
                                    #orderField="appNumber"
                                    [value]="orderField.number()"
                                    [error]="orderField.error()" />
                                <div class="cost-card-img rarity-{{ materialField.chosen()?.data?.['rarity'] ?? 1 }}-bg">
                                    @if (materialField.chosen(); as option) {
                                        <img [appMaterialIcon]="option.value" [alt]="option.value" />
                                    }
                                </div>
                                <anotoki-select
                                    label=""
                                    hideLabel
                                    required
                                    placeholder="— material —"
                                    [(appChoice)]="cost.material_id"
                                    [choices]="materialOptions()"
                                    #materialField="appChoice"
                                    [options]="materialField.options()"
                                    [value]="materialField.selected()"
                                    [none]="null"
                                    [error]="materialField.error()" />
                                <div class="cost-card-footer">
                                    <anotoki-number-field
                                        label="Qty"
                                        hideLabel
                                        placeholder="Qty"
                                        required
                                        [min]="1"
                                        [(appNumber)]="cost.quantity"
                                        #quantityField="appNumber"
                                        [value]="quantityField.number()"
                                        [error]="quantityField.error()" />
                                    <button
                                        anotokiButton
                                        variant="danger-ghost"
                                        size="sm"
                                        iconOnly
                                        aria-label="Remove this material"
                                        anotokiTooltip="Remove this material"
                                        (click)="removeCost(item.wrapper, cost)">
                                        <span class="icon icon-delete" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </div>
                        }
                    </div>
                </div>
            }
        </div>
    }

    @if (canAdd()) {
        <button anotokiButton (click)="addAscension()">Add</button>
    }
</div>
