<div class="sub-list">
    @for (entry of qualities; track entry.quality) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">{{ entry.label }}</span>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <app-entity-image
                        [label]="'Icon'"
                        [path]="iconPath(entry.quality)"
                        [name]="iconName(entry.quality)"
                        [pending]="pendingFor(entry.quality)"
                        (picked)="onPicked(entry.quality, $event)"
                        (cleared)="onCleared(entry.quality)" />
                    <anotoki-textarea label="Description" class="col-span-2" [rows]="4" [value]="description(entry.quality)" (valueChange)="onDescriptionChange(entry.quality, $event)" />
                    <anotoki-textarea label="Effect" [rows]="4" [value]="effect(entry.quality)" (valueChange)="onEffectChange(entry.quality, $event)" />
                </div>
            </div>
        </div>
    }
</div>
