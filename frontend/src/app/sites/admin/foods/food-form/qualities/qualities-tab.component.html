<div class="sub-list">
    @for (entry of qualities; track entry.quality) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">{{ entry.label }}</span>
            </div>
            <app-field-container [cols]="4">
                <app-entity-image
                    [label]="'Icon'"
                    [path]="iconPath(entry.quality)"
                    [name]="iconName(entry.quality)"
                    [pending]="pendingFor(entry.quality)"
                    (picked)="onPicked(entry.quality, $event)"
                    (cleared)="onCleared(entry.quality)"
                />
                <app-textarea
                    class="col-span-2"
                    [label]="'Description'"
                    [value]="description(entry.quality)"
                    (inputChange)="onDescriptionChange(entry.quality, $event)"
                    [rows]="4"
                ></app-textarea>
                <app-textarea
                    [label]="'Effect'"
                    [value]="effect(entry.quality)"
                    (inputChange)="onEffectChange(entry.quality, $event)"
                    [rows]="4"
                ></app-textarea>
            </app-field-container>
        </div>
    }
</div>
