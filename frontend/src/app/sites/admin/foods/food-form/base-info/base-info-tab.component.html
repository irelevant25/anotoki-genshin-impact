<div class="form-section">
    <h3 class="section-title">Identity</h3>
    <div class="form-grid">
        <anotoki-text-field
            label="Name *"
            placeholder="e.g. Adeptus Temptation"
            required
            appCheck
            #nameField="appCheck"
            [error]="nameField.error()"
            [value]="fieldText(food().data.name)"
            (valueChange)="food().data.name = $event" />
        <anotoki-select
            label="Type"
            placeholder="— none —"
            [(appChoice)]="food().data.type"
            [choices]="foodTypes()"
            #typeField="appChoice"
            [options]="typeField.options()"
            [value]="typeField.selected()"
            [none]="null" />
        <anotoki-select
            label="Region"
            placeholder="— none —"
            [(appChoice)]="food().data.region"
            [choices]="regions()"
            #regionField="appChoice"
            [options]="regionField.options()"
            [value]="regionField.selected()"
            [none]="null" />
        <anotoki-select
            label="Rarity"
            placeholder="— none —"
            [(appChoice)]="food().data.rarity"
            [choices]="rarities()"
            [suffix]="' ★'"
            #rarityField="appChoice"
            [options]="rarityField.options()"
            [value]="rarityField.selected()"
            [none]="null" />
        <anotoki-number-field
            label="Proficiency"
            [min]="0"
            [(appNumber)]="food().data.proficiency"
            #proficiencyField="appNumber"
            [value]="proficiencyField.number()"
            [error]="proficiencyField.error()" />
        <anotoki-select
            label="Base Dish"
            hint="The dish this one is an upgrade of."
            placeholder="— none —"
            [(appChoice)]="food().data.base_dish_id"
            [choices]="baseDishOptions()"
            #baseDishField="appChoice"
            [options]="baseDishField.options()"
            [value]="baseDishField.selected()"
            [none]="null" />
        <anotoki-text-field label="Version" placeholder="e.g. 1.0" [value]="fieldText(food().data.version)" (valueChange)="food().data.version = $event" />
    </div>
</div>

<div class="form-section">
    <h3 class="section-title">Effect</h3>
    <div class="container-wrap">
        <div class="d-grid gap-3 cols-1">
            <anotoki-textarea
                label="Effect"
                hint="Shared effect text, before the per-quality wording."
                [rows]="2"
                [value]="fieldText(food().data.effect)"
                (valueChange)="food().data.effect = $event" />
        </div>
    </div>
    <div class="container-wrap">
        <div class="d-grid gap-3 mt-3 cols-3">
            <anotoki-textarea label="Effect Tags" hint="One tag per line." [rows]="3" [value]="effectsText()" (valueChange)="onEffectsChange($event)" />
            <anotoki-textarea label="How To Obtain" hint="One source per line." [rows]="3" [value]="howToObtainText()" (valueChange)="onHowToObtainChange($event)" />
            <anotoki-textarea label="Events" hint="One event per line." [rows]="3" [value]="eventsText()" (valueChange)="onEventsChange($event)" />
        </div>
    </div>
</div>
