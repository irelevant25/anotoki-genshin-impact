<anotoki-page-header [heading]="food().data.name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()"><anotoki-icon name="arrowLeft" [size]="16" /> Back</a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <!-- The kit's tabs. Every panel stays in the page, hidden but for the one chosen: the
         save checks every field, and opens the tab holding the first wrong one. -->
    <anotoki-tabs #formTabs="anotokiTabs" label="Parts of the form" [tabs]="[{ id: 'base-info', label: 'Base Info', icon: 'info' }, { id: 'qualities', label: 'Qualities', icon: 'admin-layers' }, { id: 'recipe', label: 'Recipe', icon: 'admin-coins' }]" active="base-info" />
    <div class="form-tab-panel" role="tabpanel" data-tab="base-info" [id]="formTabs.panelId('base-info')" [attr.aria-labelledby]="formTabs.tabId('base-info')" [hidden]="formTabs.active() !== 'base-info'">
        <app-food-base-info-tab
            [(food)]="food"
            [foodTypes]="foodTypes()"
            [regions]="regions()"
            [rarities]="rarities()"
            [baseDishOptions]="baseDishOptions()"
        />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="qualities" [id]="formTabs.panelId('qualities')" [attr.aria-labelledby]="formTabs.tabId('qualities')" [hidden]="formTabs.active() !== 'qualities'">
        <app-food-qualities-tab [(food)]="food" />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="recipe" [id]="formTabs.panelId('recipe')" [attr.aria-labelledby]="formTabs.tabId('recipe')" [hidden]="formTabs.active() !== 'recipe'">
        <app-food-recipe-tab [(recipe)]="recipe" [materials]="materials()" />
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? 'Save Changes' : 'Create Food' }}</button>
    </div>
}
