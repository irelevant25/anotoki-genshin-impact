<div class="cost-section">
    <div class="cost-header">
        <span class="cost-label">Ingredients</span>
        <button anotokiButton (click)="addIngredient()">Add</button>
    </div>
    <div class="cost-cards">
        @for (entry of recipe(); track entry.uid) {
            <div class="cost-card">
                <div class="cost-card-img rarity-{{ materialDropdown.computedOption()?.data?.['rarity'] ?? 1 }}-bg">
                    @if (materialDropdown.computedOption(); as option) {
                        <img [appMaterialIcon]="option.value" [alt]="option.value" />
                    }
                </div>
                <app-dropdown
                    #materialDropdown
                    [options]="materialOptions()"
                    [(value)]="entry.data.material_id"
                    [required]="true"
                    [emptyOption]="true"
                    [emptyOptionText]="'— material —'"></app-dropdown>
                <div class="cost-card-footer">
                    <app-number [placeholder]="'Qty'" [(value)]="entry.data.quantity" [required]="true" [min]="1"></app-number>
                    <button anotokiButton variant="danger-ghost" size="sm" iconOnly aria-label="Remove this ingredient" anotokiTooltip="Remove this ingredient" (click)="removeIngredient(entry)">
                        <span class="icon icon-delete" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        }
    </div>
    @if (!recipe().length) {
        <p class="recipe-empty">No ingredients yet.</p>
    }
</div>
