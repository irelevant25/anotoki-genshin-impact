<div class="form-section">
    <h3 class="section-title">Identity</h3>
    <div class="form-grid">
        <anotoki-text-field
            label="Name *"
            placeholder="e.g. Wolf&#8217;s Gravestone"
            required
            appCheck
            #nameField="appCheck"
            [error]="nameField.error()"
            [value]="fieldText(weapon().data.name)"
            (valueChange)="weapon().data.name = $event" />
        <anotoki-select
            label="Type *"
            required
            [(appChoice)]="weapon().data.type"
            [choices]="weaponTypes()"
            #typeField="appChoice"
            [options]="typeField.options()"
            [value]="typeField.text()"
            [error]="typeField.error()" />
        <anotoki-select
            label="Rarity *"
            required
            [(appChoice)]="weapon().data.rarity"
            [choices]="rarities()"
            [suffix]="' ★'"
            #rarityField="appChoice"
            [options]="rarityField.options()"
            [value]="rarityField.text()"
            [error]="rarityField.error()" />
        <anotoki-select
            label="Primary Stat"
            placeholder="— none —"
            [(appChoice)]="weapon().data.primary_stat"
            [choices]="stats()"
            #primaryStatField="appChoice"
            [options]="primaryStatField.options()"
            [value]="primaryStatField.text()" />
        <anotoki-select
            label="Secondary Stat"
            placeholder="— none —"
            [(appChoice)]="weapon().data.secondary_stat"
            [choices]="stats()"
            #secondaryStatField="appChoice"
            [options]="secondaryStatField.options()"
            [value]="secondaryStatField.text()" />
        <anotoki-text-field label="Version" placeholder="e.g. 1.0" [value]="fieldText(weapon().data.version)" (valueChange)="weapon().data.version = $event" />
        <anotoki-date-field
            label="Release Date"
            [format]="dateFormat()"
            [value]="storedToFieldDate(weapon().data.release_date)"
            (valueChange)="weapon().data.release_date = fieldDateToStored($event)" />
        <anotoki-text-field
            label="Game ID"
            placeholder="e.g. 12502"
            hint="The game&#8217;s own id."
            [min]="1"
            [(appNumber)]="weapon().data.game_id"
            #gameIdField="appNumber"
            [value]="gameIdField.text()"
            [inputmode]="gameIdField.inputmode()"
            [error]="gameIdField.error()" />
    </div>
</div>

<div class="container-wrap">
    <div class="d-grid gap-3 mb-3 cols-1">
        <h3 class="section-title mb-0">Icons</h3>
        <div class="container-wrap">
            <div class="d-grid gap-5 cols-5">
                @for (image of imageFields; track image.field) {
                    <app-entity-image
                        [label]="image.label"
                        [required]="image.required"
                        [path]="imagePath(image.field)"
                        [name]="imageName(image.field)"
                        [pending]="pendingFor(image.field)"
                        (picked)="onPicked(image.field, $event)"
                        (cleared)="onCleared(image.field)" />
                }
            </div>
        </div>
        <div class="container-wrap">
            <div class="d-grid gap-3 cols-3">
                <anotoki-text-field label="Icon Name" [value]="fieldText(weapon().data.icon_name)" (valueChange)="weapon().data.icon_name = $event" />
                <anotoki-text-field label="Icon 2 Name" [value]="fieldText(weapon().data.icon_2_name)" (valueChange)="weapon().data.icon_2_name = $event" />
            </div>
        </div>
    </div>
</div>

<div class="form-section">
    <h3 class="section-title">Details</h3>
    <div class="container-wrap">
        <div class="d-grid gap-3 cols-1">
            <anotoki-textarea label="Description" [rows]="3" [value]="fieldText(weapon().data.description)" (valueChange)="weapon().data.description = $event" />
        </div>
    </div>
    <div class="container-wrap">
        <div class="d-grid gap-3 mt-3 cols-2">
            <anotoki-textarea label="How To Obtain" hint="One source per line." [rows]="3" [value]="howToObtainText()" (valueChange)="onHowToObtainChange($event)" />
            <anotoki-textarea label="Effects" hint="One tag per line, e.g. ATK." [rows]="3" [value]="effectsText()" (valueChange)="onEffectsChange($event)" />
        </div>
    </div>
</div>
