<anotoki-page-header [heading]="weapon().data.name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()">
        <anotoki-icon name="arrowLeft" [size]="16" />
        Back
    </a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <!-- The kit's tabs. Every panel stays in the page, hidden but for the one chosen: the
         save checks every field, and opens the tab holding the first wrong one. -->
    <anotoki-tabs
        #formTabs="anotokiTabs"
        label="Parts of the form"
        [tabs]="[
            { id: 'base-info', label: 'Base Info', icon: 'info' },
            { id: 'refinements', label: 'Refinements', icon: 'sparkle' },
            { id: 'ascensions', label: 'Ascensions', icon: 'admin-arrow-up' },
        ]"
        active="base-info" />
    <div
        class="form-tab-panel"
        role="tabpanel"
        data-tab="base-info"
        [id]="formTabs.panelId('base-info')"
        [attr.aria-labelledby]="formTabs.tabId('base-info')"
        [hidden]="formTabs.active() !== 'base-info'">
        <app-weapon-base-info-tab [(weapon)]="weapon" [weaponTypes]="weaponTypes()" [rarities]="rarities()" [stats]="stats()" />
    </div>
    <div
        class="form-tab-panel"
        role="tabpanel"
        data-tab="refinements"
        [id]="formTabs.panelId('refinements')"
        [attr.aria-labelledby]="formTabs.tabId('refinements')"
        [hidden]="formTabs.active() !== 'refinements'">
        <app-weapon-refinements-tab [(refinements)]="refinements" [materials]="materials()" />
    </div>
    <div
        class="form-tab-panel"
        role="tabpanel"
        data-tab="ascensions"
        [id]="formTabs.panelId('ascensions')"
        [attr.aria-labelledby]="formTabs.tabId('ascensions')"
        [hidden]="formTabs.active() !== 'ascensions'">
        <app-weapon-ascensions-tab [(ascensions)]="ascensions" [materials]="materials()" />
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? "Save Changes" : "Create Weapon" }}</button>
    </div>
}
