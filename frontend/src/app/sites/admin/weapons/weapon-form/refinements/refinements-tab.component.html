<p class="refinement-hint">The database has no refinement level column — the order of these rows is the level, R1 first.</p>

<div class="sub-list">
    @for (refinement of refinements(); track refinement.uid; let i = $index; let first = $first; let last = $last) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">R{{ i + 1 }}</span>
                <div class="refinement-actions">
                    <button anotokiButton variant="ghost" size="sm" iconOnly [disabled]="first" aria-label="Move up" anotokiTooltip="Move up" (click)="move(refinement, -1)">
                        <span class="icon icon-chevron-up icon-size-3" aria-hidden="true"></span>
                    </button>
                    <button anotokiButton variant="ghost" size="sm" iconOnly [disabled]="last" aria-label="Move down" anotokiTooltip="Move down" (click)="move(refinement, 1)">
                        <span class="icon icon-chevron-down icon-size-3" aria-hidden="true"></span>
                    </button>
                    <button anotokiButton variant="danger" (click)="removeRefinement(refinement)">Delete</button>
                </div>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <anotoki-select
                        label="Material *"
                        required
                        placeholder="— material —"
                        [(appChoice)]="refinement.data.material_id"
                        [choices]="materialOptions()"
                        #materialField="appChoice"
                        [options]="materialField.options()"
                        [value]="materialField.text()"
                        [error]="materialField.error()" />
                    <anotoki-text-field
                        label="Quantity"
                        [min]="0"
                        [(appNumber)]="refinement.data.quantity"
                        #quantityField="appNumber"
                        [value]="quantityField.text()"
                        [inputmode]="quantityField.inputmode()"
                        [error]="quantityField.error()" />
                </div>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-1">
                    <anotoki-textarea
                        label="Description *"
                        required
                        appCheck
                        #descriptionField="appCheck"
                        [error]="descriptionField.error()"
                        [rows]="3"
                        [value]="fieldText(refinement.data.description)"
                        (valueChange)="refinement.data.description = $event" />
                </div>
            </div>
        </div>
    }

    @if (canAdd()) {
        <div class="refinement-add">
            <button anotokiButton (click)="addRefinement()">Add</button>
            @if (refinements().length) {
                <button anotokiButton (click)="duplicateLast()">Duplicate last</button>
            }
        </div>
    }
</div>
