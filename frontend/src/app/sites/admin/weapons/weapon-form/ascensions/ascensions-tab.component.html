<div class="sub-list">
    @for (item of sorted(); track item.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">Phase {{ item.data.phase }}</span>
                <button anotokiButton variant="danger" (click)="removeAscension(item)">Delete</button>
            </div>
            <div class="form-grid">
                <anotoki-text-field
                    label="Phase *"
                    required
                    [min]="0"
                    [max]="maxPhase"
                    [(appNumber)]="item.data.phase"
                    #phaseField="appNumber"
                    [value]="phaseField.text()"
                    [inputmode]="phaseField.inputmode()"
                    [error]="phaseField.error()" />
                <anotoki-text-field
                    label="Primary Stat Value"
                    decimal
                    [(appNumber)]="item.data.primary_stat_value"
                    #primaryStatValueField="appNumber"
                    [value]="primaryStatValueField.text()"
                    [inputmode]="primaryStatValueField.inputmode()"
                    [error]="primaryStatValueField.error()" />
                <anotoki-text-field
                    label="Secondary Stat Value"
                    decimal
                    [(appNumber)]="item.data.secondary_stat_value"
                    #secondaryStatValueField="appNumber"
                    [value]="secondaryStatValueField.text()"
                    [inputmode]="secondaryStatValueField.inputmode()"
                    [error]="secondaryStatValueField.error()" />
                <anotoki-text-field
                    label="Start Level From"
                    [min]="1"
                    [(appNumber)]="item.data.start_level_from"
                    #startLevelFromField="appNumber"
                    [value]="startLevelFromField.text()"
                    [inputmode]="startLevelFromField.inputmode()"
                    [error]="startLevelFromField.error()" />
                <anotoki-text-field
                    label="Start Level To"
                    [min]="1"
                    [(appNumber)]="item.data.start_level_to"
                    #startLevelToField="appNumber"
                    [value]="startLevelToField.text()"
                    [inputmode]="startLevelToField.inputmode()"
                    [error]="startLevelToField.error()" />
                <anotoki-text-field
                    label="End Level From"
                    [min]="1"
                    [(appNumber)]="item.data.end_level_from"
                    #endLevelFromField="appNumber"
                    [value]="endLevelFromField.text()"
                    [inputmode]="endLevelFromField.inputmode()"
                    [error]="endLevelFromField.error()" />
                <anotoki-text-field
                    label="End Level To"
                    [min]="1"
                    [(appNumber)]="item.data.end_level_to"
                    #endLevelToField="appNumber"
                    [value]="endLevelToField.text()"
                    [inputmode]="endLevelToField.inputmode()"
                    [error]="endLevelToField.error()" />
            </div>

            @if (item.data.phase !== 0) {
                <div class="cost-section">
                    <div class="cost-header">
                        <span class="cost-label">Materials</span>
                        <button anotokiButton (click)="addCost(item)">Add</button>
                    </div>
                    <div class="cost-cards">
                        @for (cost of item.costs; track cost) {
                            <div class="cost-card">
                                <div class="cost-card-img rarity-{{ materialField.chosen()?.data?.['rarity'] ?? 1 }}-bg">
                                    @if (materialField.chosen(); as option) {
                                        <img [appMaterialIcon]="option.value" [alt]="option.value" />
                                    }
                                </div>
                                <anotoki-select
                                    label=""
                                    hideLabel
                                    required
                                    placeholder="— material —"
                                    [(appChoice)]="cost.material_id"
                                    [choices]="materialOptions()"
                                    #materialField="appChoice"
                                    [options]="materialField.options()"
                                    [value]="materialField.text()"
                                    [error]="materialField.error()" />
                                <div class="cost-card-footer">
                                    <anotoki-text-field
                                        label="Qty"
                                        hideLabel
                                        placeholder="Qty"
                                        required
                                        [min]="1"
                                        [(appNumber)]="cost.quantity"
                                        #quantityField="appNumber"
                                        [value]="quantityField.text()"
                                        [inputmode]="quantityField.inputmode()"
                                        [error]="quantityField.error()" />
                                    <button
                                        anotokiButton
                                        variant="danger-ghost"
                                        size="sm"
                                        iconOnly
                                        aria-label="Remove this material"
                                        anotokiTooltip="Remove this material"
                                        (click)="removeCost(item, cost)">
                                        <span class="icon icon-delete" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </div>
                        }
                    </div>
                </div>
            }
        </div>
    }

    @if (canAdd()) {
        <button anotokiButton (click)="addAscension()">Add</button>
    }
</div>
