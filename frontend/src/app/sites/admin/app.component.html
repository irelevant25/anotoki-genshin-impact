@if (allowed()) {
    <!-- The family's admin frame (@anotoki/lib/admin/frame): the column - the panel's name, who is signed in, Back,
         Sign out, the theme, the pages - beside the page; on a phone a row with the name and Menu, the column in the
         kit's drawer. The theme's switch is the family's: light, dark or as the device is set, the account's
         (shell-theme.ts). -->
    <anotoki-admin-frame [brand]="brand" [person]="person()" [back]="back" [signOut]="signOut" [groups]="navGroups()">
        <anotoki-theme-toggle adminFrameTheme />
        <router-outlet />
        <!-- After the page, a landmark of its own beside the <main>, never inside it: version, What's new and Feedback,
             About · Support · Terms · Privacy · Contact (the public site's pages: the links leave the panel), the fan
             clause. -->
        <anotoki-site-footer adminFrameFooter [version]="version()" [whatsNew]="!!version()" (whatsNew)="openWhatsNew()" [feedback]="feedbackOffered()" fan="hoyoverse" />
    </anotoki-admin-frame>
} @else {
    <app-admin-no-access></app-admin-no-access>
}

<!-- The kit's toasts and its questions ("Delete this character?"), for every page of the panel. -->
<anotoki-toast-host />
<anotoki-confirm-host />
