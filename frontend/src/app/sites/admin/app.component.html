@if (allowed()) {
    <div class="admin-layout">
        <!-- A phone's row (the side navigation's phone width, up to 860 px): the brand, the theme and the button
             that opens the navigation in the kit's drawer. A desktop has the navigation beside the page. -->
        @if (nav.phone()) {
            <header class="admin-phone-bar">
                <a routerLink="." class="sidebar-logo">Genshin Admin</a>
                <app-theme-toggle></app-theme-toggle>
                <button anotokiButton size="sm" [anotokiSideNavTrigger]="nav">
                    <anotoki-icon name="menu" [size]="18" />
                    Menu
                </button>
            </header>
        }

        <!-- On a phone the column is gone but its navigation stays in the page (never display: none): its drawer
             opens from it. -->
        <aside class="admin-sidebar">
            @if (!nav.phone()) {
                <div class="sidebar-header">
                    <app-theme-toggle></app-theme-toggle>
                    <a routerLink="." class="sidebar-logo">Genshin Admin</a>
                </div>
            }
            <anotoki-side-nav #nav="anotokiSideNav" class="sidebar-nav" label="Admin panel" heading="Genshin Admin" [groups]="navGroups()" [phoneMax]="860" />
        </aside>

        <main class="admin-main" id="main">
            <router-outlet></router-outlet>
        </main>
    </div>
} @else {
    <app-admin-no-access></app-admin-no-access>
}

<!-- The kit's toasts and its questions ("Delete this character?"), for every page of the panel. -->
<anotoki-toast-host />
<anotoki-confirm-host />
