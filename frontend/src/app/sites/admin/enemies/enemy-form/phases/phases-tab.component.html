<div class="sub-list">
    @for (phase of phases(); track phase.uid; let i = $index) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">Phase {{ i + 1 }} · {{ phase.data.title || "Untitled" }}</span>
                <button anotokiButton variant="danger" (click)="removePhase(phase)">Delete</button>
            </div>

            <div class="container-wrap">
                <div class="d-grid gap-3 cols-2">
                    <anotoki-text-field
                        label="Title *"
                        required
                        appCheck
                        #titleField="appCheck"
                        [error]="titleField.error()"
                        [value]="fieldText(phase.data.title)"
                        (valueChange)="phase.data.title = $event" />
                    <anotoki-text-field label="Secondary Title" [value]="fieldText(phase.data.secondary_title)" (valueChange)="phase.data.secondary_title = $event" />
                </div>
            </div>

            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <anotoki-select
                        label="Type"
                        placeholder="— none —"
                        [(appChoice)]="phase.data.living_being_type"
                        [choices]="enemyTypes()"
                        #typeField="appChoice"
                        [options]="typeField.options()"
                        [value]="typeField.text()" />
                    <anotoki-select
                        label="Family"
                        placeholder="— none —"
                        [(appChoice)]="phase.data.living_being_family"
                        [choices]="enemyFamilies()"
                        #familyField="appChoice"
                        [options]="familyField.options()"
                        [value]="familyField.text()" />
                    <anotoki-select
                        label="Group"
                        placeholder="— none —"
                        [(appChoice)]="phase.data.living_being_group"
                        [choices]="enemyGroups()"
                        #groupField="appChoice"
                        [options]="groupField.options()"
                        [value]="groupField.text()" />
                    <div class="grid-checkbox">
                        <anotoki-checkbox [checked]="!!phase.data.has_weakpoint" (checkedChange)="phase.data.has_weakpoint = $event">Has Weakpoint</anotoki-checkbox>
                    </div>
                </div>
            </div>

            <div class="container-wrap">
                <div class="d-grid gap-5 mt-2 cols-5">
                    @for (image of imageFields; track image.field) {
                        <app-entity-image
                            [label]="image.label"
                            [required]="image.required"
                            [path]="imagePath(phase, image.field)"
                            [name]="imageName(phase, image.field)"
                            [pending]="phase.pending[image.field]"
                            (picked)="onPicked(phase, image.field, $event)"
                            (cleared)="onCleared(phase, image.field)" />
                    }
                </div>
            </div>

            <div class="cost-section">
                <div class="cost-header">
                    <span class="cost-label">Damage type elements</span>
                </div>
                <anotoki-chip-group label="Damage type elements" hideLabel multiple [options]="elementChips()" [values]="phase.elements" (valuesChange)="phase.elements = [...$event]" />
            </div>
        </div>
    }

    @if (canAdd()) {
        <button anotokiButton (click)="addPhase()">Add</button>
    }
</div>
