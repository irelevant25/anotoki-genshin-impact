<div class="sub-list">
    @for (piece of pieces(); track piece.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">{{ piece.data.type }} · {{ piece.data.name || "Unnamed" }}</span>
                <button anotokiButton variant="danger" (click)="removePiece(piece)">Delete</button>
            </div>
            <div class="container-wrap">
                <div class="d-grid gap-3 cols-4">
                    <anotoki-select
                        label="Type *"
                        required
                        [(appChoice)]="piece.data.type"
                        [choices]="typeOptionsFor(piece)"
                        #typeField="appChoice"
                        [options]="typeField.options()"
                        [value]="typeField.text()"
                        [error]="typeField.error()" />
                    <anotoki-text-field
                        label="Name *"
                        class="col-span-2"
                        required
                        appCheck
                        #nameField="appCheck"
                        [error]="nameField.error()"
                        [value]="fieldText(piece.data.name)"
                        (valueChange)="piece.data.name = $event" />
                    <app-entity-image
                        [label]="'Icon'"
                        [required]="true"
                        [path]="iconPath(piece)"
                        [name]="iconName(piece)"
                        [pending]="piece.pending"
                        (picked)="onPicked(piece, $event)"
                        (cleared)="onCleared(piece)" />
                </div>
            </div>
        </div>
    }

    @if (canAdd()) {
        <div class="pieces-actions">
            <button anotokiButton (click)="addPiece()">Add</button>
            <button anotokiButton (click)="addAllMissing()">Add all {{ availableTypes().length }} missing</button>
        </div>
    }
</div>
