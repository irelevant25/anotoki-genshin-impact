<div class="sub-list">
    @for (piece of pieces(); track piece.uid) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">{{ piece.data.type }} · {{ piece.data.name || 'Unnamed' }}</span>
                <button anotokiButton variant="danger" (click)="removePiece(piece)">Delete</button>
            </div>
            <app-field-container [cols]="4">
                <app-dropdown [label]="'Type'" [options]="typeOptionsFor(piece)" [(value)]="piece.data.type" [required]="true"></app-dropdown>
                <app-text class="col-span-2" [label]="'Name'" [(value)]="piece.data.name" [required]="true"></app-text>
                <app-entity-image
                    [label]="'Icon'"
                    [required]="true"
                    [path]="iconPath(piece)"
                    [name]="iconName(piece)"
                    [pending]="piece.pending"
                    (picked)="onPicked(piece, $event)"
                    (cleared)="onCleared(piece)"
                />
            </app-field-container>
        </div>
    }

    @if (canAdd()) {
        <div class="pieces-actions">
            <button anotokiButton (click)="addPiece()">Add</button>
            <button anotokiButton (click)="addAllMissing()">Add all {{ availableTypes().length }} missing</button>
        </div>
    }
</div>
