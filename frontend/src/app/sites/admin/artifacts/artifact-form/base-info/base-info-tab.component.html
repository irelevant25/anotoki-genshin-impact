<div class="form-section">
    <h3 class="section-title">Identity</h3>
    <div class="form-grid">
        <anotoki-text-field
            label="Name *"
            placeholder="e.g. Blizzard Strayer"
            required
            appCheck
            #nameField="appCheck"
            [error]="nameField.error()"
            [value]="fieldText(artifact().data.name)"
            (valueChange)="artifact().data.name = $event" />
        <anotoki-text-field label="Version" placeholder="e.g. 1.0" [value]="fieldText(artifact().data.version)" (valueChange)="artifact().data.version = $event" />
        <anotoki-number-field
            label="Game ID"
            placeholder="e.g. 14001"
            hint="The set&#8217;s own id in the game."
            [min]="1"
            [(appNumber)]="artifact().data.game_id"
            #gameIdField="appNumber"
            [value]="gameIdField.number()"
            [error]="gameIdField.error()" />
    </div>
</div>

<div class="container-wrap">
    <div class="d-grid gap-3 mb-3 cols-1">
        <h3 class="section-title mb-0">Icon</h3>
        <div class="container-wrap">
            <div class="d-grid gap-5 cols-5">
                <app-entity-image [label]="'Set Icon'" [required]="true" [path]="iconPath()" [name]="iconName()" [pending]="artifact().pending" (picked)="onPicked($event)" (cleared)="onCleared()" />
            </div>
        </div>
    </div>
</div>

<div class="form-section">
    <h3 class="section-title">Set Bonuses</h3>
    <div class="container-wrap">
        <div class="d-grid gap-3 cols-2">
            <anotoki-textarea label="2-Piece" [rows]="3" [value]="fieldText(artifact().data.two_piece)" (valueChange)="artifact().data.two_piece = $event" />
            <anotoki-textarea label="4-Piece" [rows]="3" [value]="fieldText(artifact().data.four_piece)" (valueChange)="artifact().data.four_piece = $event" />
        </div>
    </div>
    <div class="container-wrap">
        <div class="d-grid gap-3 mt-3 cols-2">
            <anotoki-textarea label="Effects" hint="One tag per line, e.g. Healing." [rows]="3" [value]="effectsText()" (valueChange)="onEffectsChange($event)" />
        </div>
    </div>
</div>

<div class="form-section">
    <h3 class="section-title">Rarities</h3>
    <div class="rarity-grid">
        @for (rarity of rarities; track rarity) {
            <div class="rarity-block" [class.enabled]="hasRarity(rarity)">
                <anotoki-checkbox [checked]="hasRarity(rarity)" (checkedChange)="setRarity(rarity, $event)">{{ rarity }}★</anotoki-checkbox>
                @if (hasRarity(rarity)) {
                    <anotoki-textarea label="How to obtain" hint="One source per line." [rows]="3" [value]="obtainText(rarity)" (valueChange)="onObtainChange(rarity, $event)" />
                }
            </div>
        }
    </div>
</div>
