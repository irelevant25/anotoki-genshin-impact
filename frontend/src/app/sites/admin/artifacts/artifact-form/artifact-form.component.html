<anotoki-page-header [heading]="artifact().data.name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()">
        <anotoki-icon name="arrowLeft" [size]="16" />
        Back
    </a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <!-- The kit's tabs. Every panel stays in the page, hidden but for the one chosen: the
         save checks every field, and opens the tab holding the first wrong one. -->
    <anotoki-tabs
        #formTabs="anotokiTabs"
        label="Parts of the form"
        [tabs]="[
            { id: 'base-info', label: 'Base Info', icon: 'info' },
            { id: 'pieces', label: 'Pieces', icon: 'admin-layers' },
        ]"
        active="base-info" />
    <div
        class="form-tab-panel"
        role="tabpanel"
        data-tab="base-info"
        [id]="formTabs.panelId('base-info')"
        [attr.aria-labelledby]="formTabs.tabId('base-info')"
        [hidden]="formTabs.active() !== 'base-info'">
        <app-artifact-base-info-tab [(artifact)]="artifact" />
    </div>
    <div class="form-tab-panel" role="tabpanel" data-tab="pieces" [id]="formTabs.panelId('pieces')" [attr.aria-labelledby]="formTabs.tabId('pieces')" [hidden]="formTabs.active() !== 'pieces'">
        <app-artifact-pieces-tab [(pieces)]="pieces" [pieceTypes]="pieceTypes()" />
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? "Save Changes" : "Create Artifact" }}</button>
    </div>
}
