<app-modal
    [title]="heading() || guide()"
    [subtitle]="'The guide behind its question mark, in every language. Empty: the language reads the English.'"
    class="guide-editor-modal"
    (closeModal)="cancel()">
    <div modal-body>
        <!-- One tab per language, marked with whether it has anything and
             whether this session has changed it. Bringing one language level
             with another is the usual reason to be here, and that is a job of
             looking back and forth. A hidden language is there too: its guide
             can be written before it is offered. -->
        <div class="language-tabs" role="group" aria-label="Languages">
            @for (language of languages(); track language.code) {
                <button
                    type="button"
                    class="language-tab"
                    [attr.aria-pressed]="active() === language.code"
                    [class.is-active]="active() === language.code"
                    [class.is-edited]="isEdited(language.code)"
                    [class.is-missing]="!hasValue(language.code)"
                    [class.is-hidden]="!language.enabled"
                    [attr.title]="language.enabled ? null : 'Not offered to readers yet'"
                    (click)="select(language.code)">
                    <code>{{ language.code }}</code>
                    <span [attr.lang]="language.code">{{ language.native_name }}</span>
                    @if (isEdited(language.code)) {
                        <span class="tab-dot" title="Changed but not saved"></span>
                    }
                </button>
            }
        </div>

        <app-html-editor
            [(value)]="draft"
            [preview]="true"
            [minHeight]="'420px'"
            [displayError]="false"
            [placeholder]="'Nothing here yet - this language reads the English'"
            (inputChange)="commit()"></app-html-editor>

        @if (error()) {
            <p class="save-error" role="alert">{{ error() }}</p>
        }
    </div>

    <div modal-footer class="footer-row">
        <span class="footer-note">Save keeps every language you changed.</span>
        <app-button text="Revert this language" variant="secondary" [outline]="true" size="small" [disabled]="saving()" (buttonClick)="revert()"></app-button>
        <app-button text="Cancel" variant="secondary" [outline]="true" size="small" [disabled]="saving()" (buttonClick)="cancel()"></app-button>
        <app-button text="Save" icon="icon-check" size="small" [loading]="saving()" [disabled]="!dirty()" (buttonClick)="save()"></app-button>
    </div>
</app-modal>
