<anotoki-page-header heading="Backgrounds" lead="Site wallpapers. Each has a full image and a thumbnail, both filed under the background's name." />

<div class="add-row">
    <anotoki-text-field class="add-name" label="New background name…" hideLabel placeholder="New background name…" [(value)]="newName" />
    <button anotokiButton variant="primary" [disabled]="!newName()" (click)="add()"><span class="icon icon-plus" aria-hidden="true"></span> Add</button>
</div>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <div class="background-grid">
        @for (entry of backgrounds(); track entry.id) {
            <div class="background-card">

                <div class="background-head">
                    @if (renaming() === entry.id) {
                        <anotoki-text-field class="rename-input" label="" hideLabel [(value)]="renameValue" />
                        <button anotokiButton variant="primary" size="sm" [loading]="busy() === entry.id" (click)="saveRename(entry)">Save</button>
                        <button anotokiButton size="sm" (click)="cancelRename()">Cancel</button>
                    } @else {
                        <span class="background-name" [title]="entry.name">{{ entry.name }}</span>
                        <button anotokiButton variant="ghost" size="sm" iconOnly aria-label="Rename" anotokiTooltip="Rename" (click)="startRename(entry)"><span class="icon icon-pen icon-size-4" aria-hidden="true"></span></button>
                    }
                </div>

                <div class="background-images">
                    <app-entity-image
                        [label]="'Image'"
                        [path]="entry.image"
                        [name]="imageName(entry, 'image')"
                        [pending]="pendingFor(entry, 'image')"
                        (picked)="onPicked(entry, 'image', $event)"
                    />
                    <app-entity-image
                        [label]="'Preview'"
                        [path]="entry.preview"
                        [name]="imageName(entry, 'preview')"
                        [pending]="pendingFor(entry, 'preview')"
                        (picked)="onPicked(entry, 'preview', $event)"
                    />
                </div>

                <div class="background-actions">
                    <button anotokiButton variant="danger-ghost" size="sm" iconOnly aria-label="Remove" anotokiTooltip="Remove" [loading]="busy() === entry.id" (click)="confirmDelete(entry)"><span class="icon icon-trash icon-size-4" aria-hidden="true"></span></button>
                </div>
            </div>
        } @empty {
            <p class="pane-empty">No backgrounds yet. Add one above, then upload its image and preview.</p>
        }
    </div>
}
