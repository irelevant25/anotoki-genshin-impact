<anotoki-page-header [heading]="material().name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()"><anotoki-icon name="arrowLeft" [size]="16" /> Back</a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <div class="form-section">
        <h3 class="section-title">Identity</h3>
        <div class="form-grid">
            <app-text [label]="'Name'" [placeholder]="'e.g. Dandelion Seed'" [(value)]="material().name" [required]="true"></app-text>
            <app-dropdown [label]="'Type'" [options]="materialTypes()" [(value)]="material().type" [emptyOption]="true" [emptyOptionText]="'— none —'"></app-dropdown>
            <app-dropdown
                [label]="'Primary Group'"
                [options]="materialGroups()"
                [(value)]="material().group"
                [emptyOption]="true"
                [emptyOptionText]="'— none —'"
            ></app-dropdown>
            <app-dropdown [label]="'Region'" [options]="regions()" [(value)]="material().region" [emptyOption]="true" [emptyOptionText]="'— none —'"></app-dropdown>
            <app-dropdown
                [label]="'Rarity'"
                [options]="rarities()"
                [(value)]="material().rarity"
                [suffix]="' ★'"
                [emptyOption]="true"
                [emptyOptionText]="'— none —'"
            ></app-dropdown>
            <app-text [label]="'Version'" [placeholder]="'e.g. 1.0'" [(value)]="material().version"></app-text>
        </div>
    </div>

    <app-field-container [class]="'gap-2 mb-3'" [cols]="1">
        <h3 class="section-title mb-0">Icon</h3>
        <app-field-container [class]="'gap-5'" [cols]="5">
            <app-entity-image
                [label]="'Icon'"
                [path]="material().icon"
                [name]="iconName()"
                [pending]="pendingIcon()"
                (picked)="onIconPicked($event)"
                (cleared)="onIconCleared()"
            />
        </app-field-container>
    </app-field-container>

    <div class="form-section">
        <h3 class="section-title">Additional Groups</h3>
        <app-field-container [cols]="2">
            <app-multiselect
                [label]="'Groups'"
                [description]="'Extra groups this material belongs to, beyond the primary one.'"
                [options]="materialGroups()"
                [(value)]="groups"
            ></app-multiselect>
        </app-field-container>
    </div>

    <div class="form-section">
        <h3 class="section-title">Details</h3>
        <app-field-container [cols]="2">
            <app-textarea [label]="'Description'" [(value)]="material().description" [rows]="4"></app-textarea>
            <app-textarea
                [label]="'How To Obtain'"
                [description]="'One source per line.'"
                [value]="howToObtainText()"
                (inputChange)="onHowToObtainChange($event)"
                [rows]="4"
            ></app-textarea>
        </app-field-container>
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? 'Save Changes' : 'Create Material' }}</button>
    </div>
}
