<anotoki-page-header [heading]="material().name || pageTitle()">
    <a pageEyebrow anotokiButton variant="link" size="sm" class="back-link" [routerLink]="backLink()"><anotoki-icon name="arrowLeft" [size]="16" /> Back</a>
</anotoki-page-header>

@if (loading()) {
    <anotoki-spinner class="page-spinner" label />
} @else {
    <div class="form-section">
        <h3 class="section-title">Identity</h3>
        <div class="form-grid">
            <anotoki-text-field label="Name *" placeholder="e.g. Dandelion Seed" required appCheck #nameField="appCheck" [error]="nameField.error()" [value]="fieldText(material().name)" (valueChange)="material().name = $event" />
            <anotoki-select label="Type" placeholder="— none —" [(appChoice)]="material().type" [choices]="materialTypes()" #typeField="appChoice" [options]="typeField.options()" [value]="typeField.text()" />
            <anotoki-select
                label="Primary Group"
                placeholder="— none —"
                [(appChoice)]="material().group"
                [choices]="materialGroups()"
                #groupField="appChoice"
                [options]="groupField.options()"
                [value]="groupField.text()"
            />
            <anotoki-select label="Region" placeholder="— none —" [(appChoice)]="material().region" [choices]="regions()" #regionField="appChoice" [options]="regionField.options()" [value]="regionField.text()" />
            <anotoki-select
                label="Rarity"
                placeholder="— none —"
                [(appChoice)]="material().rarity"
                [choices]="rarities()"
                [suffix]="' ★'"
                #rarityField="appChoice"
                [options]="rarityField.options()"
                [value]="rarityField.text()"
            />
            <anotoki-text-field label="Version" placeholder="e.g. 1.0" [value]="fieldText(material().version)" (valueChange)="material().version = $event" />
        </div>
    </div>

    <div class="container-wrap">
        <div class="d-grid gap-3 mb-3 cols-1">
            <h3 class="section-title mb-0">Icon</h3>
            <div class="container-wrap">
                <div class="d-grid gap-5 cols-5">
                    <app-entity-image
                        [label]="'Icon'"
                        [path]="material().icon"
                        [name]="iconName()"
                        [pending]="pendingIcon()"
                        (picked)="onIconPicked($event)"
                        (cleared)="onIconCleared()"
                    />
                </div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3 class="section-title">Additional Groups</h3>
        <div class="container-wrap">
            <div class="d-grid gap-3 cols-2">
                <app-multiselect
                    [label]="'Groups'"
                    [description]="'Extra groups this material belongs to, beyond the primary one.'"
                    [options]="materialGroups()"
                    [(value)]="groups"
                ></app-multiselect>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3 class="section-title">Details</h3>
        <div class="container-wrap">
            <div class="d-grid gap-3 cols-2">
                <anotoki-textarea label="Description" [rows]="4" [value]="fieldText(material().description)" (valueChange)="material().description = $event" />
                <anotoki-textarea label="How To Obtain" hint="One source per line." [rows]="4" [value]="howToObtainText()" (valueChange)="onHowToObtainChange($event)" />
            </div>
        </div>
    </div>

    <div class="form-footer">
        <a anotokiButton [routerLink]="backLink()">Cancel</a>
        <button anotokiButton variant="primary" [loading]="saving()" (click)="save()">{{ isEdit() ? 'Save Changes' : 'Create Material' }}</button>
    </div>
}
