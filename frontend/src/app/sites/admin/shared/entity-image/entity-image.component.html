<div class="entity-image">
    <span class="entity-image-label">
        {{ label() }}
        @if (required()) {
            <span class="required-indicator">*</span>
        }
    </span>

    <div class="entity-image-frame" [class.is-audio]="kind() === 'audio'" [class.empty]="!src()" [class.pending]="!!pending()" [class.error]="!!error()">
        @if (src(); as source) {
            @if (kind() === "audio") {
                <audio controls preload="none" [src]="source"></audio>
            } @else {
                <!-- The kit's tooltip names the file the slot shows. -->
                <img [src]="source" [alt]="label()" [anotokiTooltip]="fileWords()" />
            }
        } @else {
            <span class="entity-image-empty">none</span>
        }
    </div>

    @if (displayName()) {
        <span class="entity-image-name" [title]="displayName()">{{ displayName() }}</span>
    }

    <div class="entity-image-actions">
        <button anotokiButton size="sm" (click)="open()">
            <span class="icon icon-upload" aria-hidden="true"></span>
            {{ hasImage() ? "Replace" : "Upload" }}
        </button>
        @if (pending()) {
            <button anotokiButton variant="ghost" size="sm" iconOnly aria-label="Discard this pick" anotokiTooltip="Discard this pick" (click)="clear()">
                <span class="icon icon-close" aria-hidden="true"></span>
            </button>
        }
    </div>

    @if (pending()) {
        <span class="entity-image-hint">uploads on save</span>
    }

    @if (error(); as words) {
        <div class="error-message" role="alert" aria-live="polite">{{ words }}</div>
    }
</div>
