<app-modal [title]="title()" (closeModal)="closeModal()">
    <div modal-body class="form">
        <app-text [label]="'Username'" [required]="true" [autocomplete]="'off'" [(value)]="username" [disabled]="saving()"></app-text>
        <app-text [label]="'Email'" [required]="true" [autocomplete]="'off'" [(value)]="email" [disabled]="saving()"></app-text>

        @if (isNew()) {
            <div class="password-row">
                <app-password
                    [label]="'Password'"
                    [required]="true"
                    [autocomplete]="'new-password'"
                    [description]="'Generated for you. Read it out to them — they can change it themselves once they are in.'"
                    [(value)]="password"
                    [(isPasswordVisible)]="passwordVisible"
                    [disabled]="saving()"
                ></app-password>
                <app-button
                    text="New one"
                    icon="icon-refresh icon-size-3"
                    variant="secondary"
                    [outline]="true"
                    size="small"
                    [disabled]="saving()"
                    tooltipText="Generate a different password"
                    (buttonClick)="regenerate()"
                ></app-button>
            </div>
        }

        <app-dropdown [label]="'Role'" [options]="roles()" [(value)]="role" [disabled]="saving() || isSelf()"></app-dropdown>

        @if (isSelf()) {
            <p class="note">This is your own account, so its role is fixed here — nobody gets to remove their own way back in.</p>
        }

        @if (!isNew()) {
            <app-checkbox [label]="'Email confirmed'" [(value)]="confirmed" [disabled]="saving()"></app-checkbox>
            <p class="note">The password is not changed here. Use <strong>Password</strong> in the list to set a new one.</p>
        }
    </div>

    <div modal-footer class="footer">
        <span class="footer-spacer"></span>
        <app-button text="Cancel" variant="secondary" [outline]="true" [disabled]="saving()" (buttonClick)="closeModal()"></app-button>
        <app-button
            [text]="isNew() ? 'Create account' : 'Save'"
            icon="icon-check"
            [loading]="saving()"
            [disabled]="!canSave()"
            (buttonClick)="save()"
        ></app-button>
    </div>
</app-modal>
