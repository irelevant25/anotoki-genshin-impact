<div class="entity-image">
    <span class="entity-image-label">
        {{ label() }}
        @if (required()) {
            <span class="required-indicator">*</span>
        }
    </span>

    <div class="entity-image-frame" [class.empty]="!src()" [class.pending]="!!pending()">
        @if (src(); as source) {
            <img #img [src]="source" [alt]="label()" />
            <app-tooltip [targetHTMLElement]="img" [standalone]="true">
                <img class="w-100" [src]="source" [alt]="label()" />
            </app-tooltip>
        } @else {
            <span class="entity-image-empty">none</span>
        }
    </div>

    @if (displayName()) {
        <span class="entity-image-name" [title]="displayName()">{{ displayName() }}</span>
    }

    <div class="entity-image-actions">
        <app-button
            [text]="hasImage() ? 'Replace' : 'Upload'"
            icon="icon-upload"
            variant="secondary"
            [outline]="true"
            size="very-small"
            (buttonClick)="open()"
        ></app-button>
        @if (pending()) {
            <app-button icon="icon-close" variant="secondary" [outline]="true" size="very-small" tooltipText="Discard this pick" (buttonClick)="clear()"></app-button>
        }
    </div>

    @if (pending()) {
        <span class="entity-image-hint">uploads on save</span>
    }
</div>
