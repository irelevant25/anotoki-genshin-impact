<app-modal [title]="title()" (closeModal)="cancel()">
    <div modal-body class="upload-body">
        <app-file
            [label]="'File'"
            [buttonText]="'Choose image'"
            [buttonOutline]="true"
            [acceptedExtensions]="imageExtensions"
            [fileNamePosition]="'right'"
            (inputChange)="onFileSelect($event)"
        ></app-file>

        @if (preview(); as src) {
            <div class="upload-preview">
                <img [src]="src" [alt]="trimmedName()" />
            </div>
        }

        <app-text
            [label]="'Name'"
            [description]="'Without folder or extension. The file is uploaded when you save, into the folder for this field.'"
            [placeholder]="'e.g. HU_TAO'"
            [(value)]="name"
            [required]="true"
        ></app-text>

        @if (error(); as message) {
            <p class="upload-error">{{ message }}</p>
        }
    </div>

    <div modal-footer class="upload-footer">
        <app-button text="Cancel" variant="secondary" [outline]="true" (buttonClick)="cancel()"></app-button>
        <app-button text="Use this image" [disabled]="!canSubmit()" (buttonClick)="submit()"></app-button>
    </div>
</app-modal>
