<div class="sub-list">
    @for (ta of talents(); track $index; let i = $index) {
        <div class="sub-card">
            <div class="sub-card-header">
                <span class="sub-card-index">{{ ta.type }} · {{ ta.name || 'Unnamed' }}</span>
                <app-button icon="fa-solid fa-xmark" variant="danger" [outline]="true" size="very-small" (buttonClick)="removeTalent(i)"></app-button>
            </div>
            <div class="form-grid">
                <app-text [label]="'Name'" [(value)]="ta.name" [required]="true"></app-text>
                <app-dropdown [label]="'Type'" [options]="talentTypes()" [(value)]="ta.type" [required]="true"></app-dropdown>
                <div class="form-field col-span-2">
                    <app-file [label]="'Icon'" [buttonOutline]="true" (inputChange)="onTalentIconSelect(i, $event)" [required]="true"></app-file>
                    @if (taIconPreview(i); as src) {
                        <img #img [src]="src" class="preview-img" alt="" />
                        <app-tooltip [targetHTMLElement]="img" [standalone]="true">
                            <img class="w-100" [src]="src" />
                        </app-tooltip>
                    }
                </div>
                <app-textarea [label]="'Description'" [(value)]="ta.description" [rows]="4" [class]="'col-span-2'"></app-textarea>
            </div>

            <div class="cost-section">
                <div class="cost-header">
                    <span class="cost-label">Level-up Materials</span>
                    <app-button text="+ Add Level" variant="secondary" [outline]="true" size="very-small" (buttonClick)="addTalentLevel(i)"></app-button>
                </div>
                @for (level of talentCostLevels(i); track level) {
                    <div class="talent-level-row">
                        <span class="talent-level-label">Lv {{ level }}</span>
                        <div class="cost-cards">
                            @for (entry of talentCostsByLevel(i, level); track entry.ci) {
                                <div class="cost-card">
                                    <div class="cost-card-img"><i class="fa-solid fa-gem"></i></div>
                                    <app-dropdown [options]="materialOptions()" [value]="entry.cost.material_id" (inputChange)="setTalentCost(i, entry.ci, 'material_id', $event)" [emptyOption]="true" [emptyOptionText]="'— material —'"></app-dropdown>
                                    <div class="cost-card-footer">
                                        <input
                                            class="admin-input"
                                            type="number"
                                            min="1"
                                            [value]="entry.cost.quantity"
                                            (input)="setTalentCost(i, entry.ci, 'quantity', +$any($event.target).value)"
                                            placeholder="Qty"
                                        />
                                        <app-button icon="fa-solid fa-xmark" variant="danger" [outline]="true" size="very-small" (buttonClick)="removeTalentCost(i, entry.ci)"></app-button>
                                    </div>
                                </div>
                            }
                        </div>
                        <div class="talent-level-actions">
                            <app-button text="+ Mat" variant="secondary" [outline]="true" size="very-small" (buttonClick)="addTalentCostToLevel(i, level)"></app-button>
                            <app-button icon="fa-solid fa-xmark" variant="danger" [outline]="true" size="very-small" (buttonClick)="removeTalentLevel(i, level)"></app-button>
                        </div>
                    </div>
                }
            </div>
        </div>
    }
    <app-button text="+ Add Talent" variant="secondary" [outline]="true" size="small" (buttonClick)="addTalent()"></app-button>
</div>
