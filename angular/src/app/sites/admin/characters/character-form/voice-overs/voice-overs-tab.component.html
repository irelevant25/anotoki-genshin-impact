<div class="d-flex flex-column gap-5">
    @for (type of voiceOverTypes(); track type) {
        <app-accordion [onlyOneOpen]="false">
            <app-accordion-item [lazy]="true" [title]="type + ' (' + (vosByType()[type]?.length ?? 0) + ')'" [gap]="false">
                <app-accordion [onlyOneOpen]="false">
                    @for (entry of vosByType()[type]; track entry.index) {
                        <app-accordion-item [lazy]="true" [title]="entry.displayTitle" class="secondary">
                            <div class="sub-card d-flex flex-col gap-3">
                                <div class="sub-card-header">
                                    <app-number [label]="'Order'" [value]="entry.vo.order" [required]="true" [min]="1" [max]="vosByType()[type]?.length ?? 1" (inputChange)="onOrderChange(entry.index, type, $event)"></app-number>
                                    <app-button icon="icon-delete" variant="danger" [outline]="true" size="very-small" (buttonClick)="removeVoiceOver(entry.index)"></app-button>
                                </div>
                                <app-tabs>
                                    <app-tab [title]="'English'">
                                        <app-text-field-container [cols]="1">
                                            <app-text [label]="'Title'" [(value)]="entry.vo.title_english" [required]="true"></app-text>
                                            <app-textarea [label]="'Text'" [(value)]="entry.vo.text_english" [rows]="3" [resize]="false"></app-textarea>
                                            <app-file
                                                [label]="'Audio File'"
                                                [buttonOutline]="true"
                                                [description]="entry.vo.audio_english ?? ''"
                                                (inputChange)="onVoiceOverAudioSelect(entry.index, 'english', $event)"
                                                [fileNamePosition]="'right'"
                                            ></app-file>
                                        </app-text-field-container>
                                    </app-tab>
                                    <app-tab [title]="'Japanese'">
                                        <app-text-field-container [cols]="1">
                                            <app-text-field-container [cols]="1">
                                                <app-text [label]="'Title'" [(value)]="entry.vo.title_japanese"></app-text>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="2">
                                                <app-textarea [label]="'Text'" [(value)]="entry.vo.text_japanese" [rows]="3" [resize]="false"></app-textarea>
                                                <app-textarea [label]="'Text Reading'" [(value)]="entry.vo.text_japanese_reading" [rows]="3" [resize]="false"></app-textarea>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="1">
                                                <app-file
                                                    [label]="'Audio File'"
                                                    [buttonOutline]="true"
                                                    [description]="entry.vo.audio_japanese ?? ''"
                                                    (inputChange)="onVoiceOverAudioSelect(entry.index, 'japanese', $event)"
                                                    [fileNamePosition]="'right'"
                                                ></app-file>
                                            </app-text-field-container>
                                        </app-text-field-container>
                                    </app-tab>
                                    <app-tab [title]="'Chinese'">
                                        <app-text-field-container [cols]="1">
                                            <app-text-field-container [cols]="1">
                                                <app-text [label]="'Title'" [(value)]="entry.vo.title_chinese"></app-text>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="2">
                                                <app-textarea [label]="'Text'" [(value)]="entry.vo.text_chinese" [rows]="3" [resize]="false"></app-textarea>
                                                <app-textarea [label]="'Text Reading'" [(value)]="entry.vo.text_chinese_reading" [rows]="3" [resize]="false"></app-textarea>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="1">
                                                <app-file
                                                    [label]="'Audio File'"
                                                    [buttonOutline]="true"
                                                    [description]="entry.vo.audio_chinese ?? ''"
                                                    (inputChange)="onVoiceOverAudioSelect(entry.index, 'chinese', $event)"
                                                    [fileNamePosition]="'right'"
                                                ></app-file>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="1">
                                                <app-text [label]="'Title (Traditional Chinese)'" [(value)]="entry.vo.title_chinese_traditional"></app-text>
                                                <app-textarea [label]="'Text (Traditional Chinese)'" [(value)]="entry.vo.text_chinese_traditional" [rows]="3" [resize]="false"></app-textarea>
                                            </app-text-field-container>
                                        </app-text-field-container>
                                    </app-tab>
                                    <app-tab [title]="'Korean'">
                                        <app-text-field-container [cols]="1">
                                            <app-text-field-container [cols]="1">
                                                <app-text [label]="'Title'" [(value)]="entry.vo.title_korean"></app-text>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="2">
                                                <app-textarea [label]="'Text'" [(value)]="entry.vo.text_korean" [rows]="3" [resize]="false"></app-textarea>
                                                <app-textarea [label]="'Text Reading'" [(value)]="entry.vo.text_korean_reading" [rows]="3" [resize]="false"></app-textarea>
                                            </app-text-field-container>
                                            <app-text-field-container [cols]="1">
                                                <app-file
                                                    [label]="'Audio File'"
                                                    [buttonOutline]="true"
                                                    [description]="entry.vo.audio_korean ?? ''"
                                                    (inputChange)="onVoiceOverAudioSelect(entry.index, 'korean', $event)"
                                                    [fileNamePosition]="'right'"
                                                ></app-file>
                                            </app-text-field-container>
                                        </app-text-field-container>
                                    </app-tab>
                                </app-tabs>
                            </div>
                        </app-accordion-item>
                    }
                </app-accordion>
            </app-accordion-item>
            <div class="vo-lang-actions mt-2">
                <app-button [text]="'Add ' + type + ' voice over'" variant="success" [outline]="true" size="very-small" (buttonClick)="addVoiceOver(type)"></app-button>
            </div>
        </app-accordion>
    }
</div>
