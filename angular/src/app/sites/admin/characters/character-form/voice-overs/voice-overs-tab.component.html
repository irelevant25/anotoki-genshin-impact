<div class="d-flex flex-column gap-5">
    @for (type of voiceOverTypes(); track type) {
        <app-accordion [onlyOneOpen]="false">
            <app-accordion-item [lazy]="true" [title]="type + ' (' + (vosByType()[type]?.length ?? 0) + ')'" [gap]="false">
                <app-accordion [onlyOneOpen]="false">
                    @for (entry of vosByType()[type]; track entry; let index = $index) {
                        <app-accordion-item [lazy]="true" [title]="entry.displayTitle" class="secondary">
                            <div class="sub-card">
                                <div class="sub-card-header">
                                    <app-number
                                        [label]="'Order'"
                                        [value]="entry.data.order"
                                        [required]="true"
                                        [min]="1"
                                        [max]="vosByType()[type]?.length ?? 1"
                                        (inputChange)="onOrderChange(entry.data, $event)"
                                    ></app-number>
                                    <app-button variant="danger" [outline]="true" (buttonClick)="removeVoiceOver(index)">Delete</app-button>
                                </div>
                                <app-tabs (activeTabChange)="stopAudio()">
                                    <app-tab [title]="'English'">
                                        <app-voice-overs-tab-item [entry]="entry" [index]="index" [language]="'english'" [(audio)]="audio" [(playingKey)]="playingKey"></app-voice-overs-tab-item>
                                    </app-tab>
                                    <app-tab [title]="'Japanese'">
                                        <app-voice-overs-tab-item [entry]="entry" [index]="index" [language]="'japanese'" [(audio)]="audio" [(playingKey)]="playingKey"></app-voice-overs-tab-item>
                                    </app-tab>
                                    <app-tab [title]="'Chinese'">
                                        <app-voice-overs-tab-item [entry]="entry" [index]="index" [language]="'chinese'" [(audio)]="audio" [(playingKey)]="playingKey"></app-voice-overs-tab-item>
                                    </app-tab>
                                    <app-tab [title]="'Korean'">
                                        <app-voice-overs-tab-item [entry]="entry" [index]="index" [language]="'korean'" [(audio)]="audio" [(playingKey)]="playingKey"></app-voice-overs-tab-item>
                                    </app-tab>
                                </app-tabs>
                            </div>
                        </app-accordion-item>
                    }
                </app-accordion>
            </app-accordion-item>
            <div class="vo-lang-actions mt-2">
                <app-button variant="primary" [outline]="true" (buttonClick)="addVoiceOver(type)">Add {{ type }}</app-button>
            </div>
        </app-accordion>
    }
</div>
