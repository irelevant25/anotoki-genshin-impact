<app-modal [title]="'Choose a voice-over set'" (closeModal)="cancel()">
    <div modal-body class="set-body">
        <p class="set-hint">
            Point this character at another set's voice-overs — used to give the Traveler's variants one shared set. It only changes which set
            this character uses; the lines themselves are left as they are.
        </p>

        <app-loader #loader [loading]="loadingSets()"></app-loader>

        @if (!loadingSets()) {
            <div class="set-list">
                @for (set of sets(); track set.id) {
                    <button
                        type="button"
                        class="set-row"
                        [class.selected]="selectedId() === set.id"
                        [class.current]="currentSetId() === set.id"
                        (click)="selectedId.set(set.id)">
                        <span class="set-members">{{ members(set) }}</span>
                        <span class="set-meta">{{ set.voice_over_count }} lines · set #{{ set.id }}{{ currentSetId() === set.id ? " · current" : "" }}</span>
                    </button>
                } @empty {
                    <p class="set-empty">No voice-over sets yet.</p>
                }
            </div>
        }
    </div>

    <div modal-footer class="set-footer">
        <app-button [text]="'Use this set'" variant="primary" [disabled]="selectedId() === null" (buttonClick)="choose()"></app-button>
        <app-button [text]="'Cancel'" variant="secondary" [outline]="true" (buttonClick)="cancel()"></app-button>
    </div>
</app-modal>
