<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <app-theme-toggle></app-theme-toggle>
            <a routerLink="." class="sidebar-logo">
                <span>Genshin Admin</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <a routerLink="." routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item nav-dashboard">
                <i class="fa-solid fa-gauge"></i>
                <span>Dashboard</span>
            </a>

            @for (group of navGroups; track group.label) {
                <div class="nav-group">
                    <div class="nav-group-label">{{ group.label }}</div>
                    @for (item of group.items; track item.path) {
                        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" [class.read-only]="item.readOnly">
                            @if (item.icon) {
                                <i [class]="item.icon"></i>
                            }
                            <span>{{ item.label }}</span>
                            @if (item.readOnly) {
                                <span class="badge-readonly">R</span>
                            }
                        </a>
                    }
                </div>
            }
        </nav>
    </aside>

    <main class="admin-main">
        <router-outlet></router-outlet>
    </main>
</div>

<app-notification></app-notification>
