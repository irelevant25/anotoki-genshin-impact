<div class="form-section">
    <h3 class="section-title">Identity</h3>
    <div class="form-grid">
        <app-text [label]="'Name'" [placeholder]="'e.g. Blizzard Strayer'" [(value)]="artifact().data.name" [required]="true"></app-text>
        <app-text [label]="'Version'" [placeholder]="'e.g. 1.0'" [(value)]="artifact().data.version"></app-text>
    </div>
</div>

<app-field-container [class]="'gap-2 mb-3'" [cols]="1">
    <h3 class="section-title mb-0">Icon</h3>
    <app-field-container [class]="'gap-5'" [cols]="5">
        <div>
            <app-file
                class="d-block"
                [buttonClass]="'w-100'"
                [label]="'Set Icon'"
                [buttonOutline]="true"
                [required]="!iconSrc()"
                [acceptedExtensions]="imageExtensions"
                [showFileNames]="false"
                (inputChange)="onIconSelect($event)"
            ></app-file>
            @if (iconSrc(); as src) {
                <img #img [src]="src" class="preview-img" [alt]="artifact().data.name" />
                <app-tooltip [targetHTMLElement]="img" [standalone]="true">
                    <img class="w-100" [src]="src" [alt]="artifact().data.name" />
                </app-tooltip>
            }
        </div>
    </app-field-container>
</app-field-container>

<div class="form-section">
    <h3 class="section-title">Set Bonuses</h3>
    <app-field-container [cols]="2">
        <app-textarea [label]="'2-Piece'" [(value)]="artifact().data.two_piece" [rows]="3"></app-textarea>
        <app-textarea [label]="'4-Piece'" [(value)]="artifact().data.four_piece" [rows]="3"></app-textarea>
    </app-field-container>
    <app-field-container [class]="'mt-3'" [cols]="2">
        <app-textarea
            [label]="'Effects'"
            [description]="'One tag per line, e.g. Healing.'"
            [value]="effectsText()"
            (inputChange)="onEffectsChange($event)"
            [rows]="3"
        ></app-textarea>
    </app-field-container>
</div>

<div class="form-section">
    <h3 class="section-title">Rarities</h3>
    <div class="rarity-grid">
        @for (rarity of rarities; track rarity) {
            <div class="rarity-block" [class.enabled]="hasRarity(rarity)">
                <app-checkbox
                    [label]="rarity + '★'"
                    [inline]="true"
                    [value]="hasRarity(rarity)"
                    (inputChange)="setRarity(rarity, $event)"
                ></app-checkbox>
                @if (hasRarity(rarity)) {
                    <app-textarea
                        [label]="'How to obtain'"
                        [description]="'One source per line.'"
                        [value]="obtainText(rarity)"
                        (inputChange)="onObtainChange(rarity, $event)"
                        [rows]="3"
                    ></app-textarea>
                }
            </div>
        }
    </div>
</div>
