<app-modal [title]="'feedback.title' | translate" (closeModal)="closeModal()">
    <div modal-body>
        <form [formGroup]="feedbackForm" class="feedback-form d-flex flex-col flex-wrap gap-3">
            <!-- Type Selection -->
            <app-dropdown [label]="'feedback.type' | translate" [options]="typeOptions()" [value]="feedbackType" (valueChange)="onTypeChange($event)"> </app-dropdown>

            <!-- Who it is from. Optional for everyone: an empty address is
                 an anonymous message, whether or not anyone is signed in. -->
            <div class="from-block">
                @if (signedIn()) {
                    <app-checkbox
                        [label]="'feedback.anonymous' | translate"
                        labelPosition="right"
                        [value]="anonymous()"
                        (inputChange)="setAnonymous($any($event))"
                    ></app-checkbox>
                }

                @if (anonymous()) {
                    <p class="from-note">{{ 'feedback.anonymousNote' | translate }}</p>
                } @else {
                    <app-text
                        [label]="'feedback.emailOptional' | translate"
                        [description]="'feedback.emailHelp' | translate"
                        [placeholder]="'login.emailPlaceholder' | translate"
                        [value]="feedbackForm.controls['email'].value"
                        (valueChange)="feedbackForm.controls['email'].setValue($event)"
                    >
                    </app-text>
                }
            </div>

            <!-- Section (for Bug and Suggestion) -->
            @if (feedbackType !== 'Other') {
                <app-dropdown
                    [label]="'feedback.section' | translate"
                    [options]="sections"
                    [placeholder]="'feedback.sectionPlaceholder' | translate"
                    [value]="feedbackForm.controls['section'].value"
                    (valueChange)="feedbackForm.controls['section'].setValue($event)"
                >
                </app-dropdown>
            }

            <!-- Title (for Bug and Suggestion) -->
            @if (feedbackType !== 'Other') {
                <app-text [label]="'feedback.subject' | translate" [required]="true" [placeholder]="'feedback.subjectPlaceholder' | translate" [value]="feedbackForm.controls['title'].value" (valueChange)="feedbackForm.controls['title'].setValue($event)">
                </app-text>
            }

            <!-- Bug-specific fields -->
            @if (feedbackType === 'Bug') {
                <app-textarea
                    [label]="'feedback.steps' | translate"
                    [rows]="3"
                    [placeholder]="'feedback.stepsPlaceholder' | translate"
                    [value]="feedbackForm.controls['stepsToReproduce'].value"
                    (valueChange)="feedbackForm.controls['stepsToReproduce'].setValue($event)"
                >
                </app-textarea>
                <app-textarea
                    [label]="'feedback.expected' | translate"
                    [rows]="2"
                    [placeholder]="'feedback.expectedPlaceholder' | translate"
                    [value]="feedbackForm.controls['expectedBehavior'].value"
                    (valueChange)="feedbackForm.controls['expectedBehavior'].setValue($event)"
                >
                </app-textarea>
                <app-textarea
                    [label]="'feedback.actual' | translate"
                    [rows]="2"
                    [placeholder]="'feedback.actualPlaceholder' | translate"
                    [value]="feedbackForm.controls['actualBehavior'].value"
                    (valueChange)="feedbackForm.controls['actualBehavior'].setValue($event)"
                >
                </app-textarea>
                <app-text
                    [label]="'feedback.browser' | translate"
                    [placeholder]="'feedback.browserPlaceholder' | translate"
                    [value]="feedbackForm.controls['browserDeviceInfo'].value"
                    (valueChange)="feedbackForm.controls['browserDeviceInfo'].setValue($event)"
                >
                </app-text>
                <app-textarea
                    [label]="'feedback.additional' | translate"
                    [rows]="3"
                    [placeholder]="'feedback.additionalPlaceholder' | translate"
                    [value]="feedbackForm.controls['additionalInfo'].value"
                    (valueChange)="feedbackForm.controls['additionalInfo'].setValue($event)"
                >
                </app-textarea>
            }

            <!-- Suggestion-specific fields -->
            @if (feedbackType === 'Suggestion') {
                <app-textarea
                    [label]="'feedback.details' | translate"
                    [rows]="4"
                    [placeholder]="'feedback.detailsPlaceholder' | translate"
                    [value]="feedbackForm.controls['details'].value"
                    (valueChange)="feedbackForm.controls['details'].setValue($event)"
                >
                </app-textarea>
                <app-textarea
                    [label]="'feedback.whyImportant' | translate"
                    [rows]="3"
                    [placeholder]="'feedback.whyImportantPlaceholder' | translate"
                    [value]="feedbackForm.controls['whyImportant'].value"
                    (valueChange)="feedbackForm.controls['whyImportant'].setValue($event)"
                >
                </app-textarea>
                <app-textarea
                    [label]="'feedback.additional' | translate"
                    [rows]="3"
                    [placeholder]="'feedback.additionalPlaceholder' | translate"
                    [value]="feedbackForm.controls['additionalInfo'].value"
                    (valueChange)="feedbackForm.controls['additionalInfo'].setValue($event)"
                >
                </app-textarea>
            }

            <!-- Other-specific fields -->
            @if (feedbackType === 'Other') {
                <app-textarea
                    [label]="'feedback.message' | translate"
                    [required]="true"
                    [rows]="6"
                    [placeholder]="'feedback.messagePlaceholder' | translate"
                    [value]="feedbackForm.controls['message'].value"
                    (valueChange)="feedbackForm.controls['message'].setValue($event)"
                >
                </app-textarea>
            }
        </form>
    </div>
    <div modal-footer class="d-flex gap-3 justify-content-end">
        <app-button [text]="'common.cancel' | translate" variant="secondary" (buttonClick)="onCancel()"> </app-button>
        <app-button [text]="'common.submit' | translate" variant="primary" (buttonClick)="onSubmit()"> </app-button>
    </div>
</app-modal>

<app-loader [loading]="loading()" [text]="'feedback.sending' | translate"> </app-loader>
