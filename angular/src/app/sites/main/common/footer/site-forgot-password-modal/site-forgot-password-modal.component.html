<app-modal [title]="'account.reset.title' | translate" (closeModal)="closeModal()">
    <div modal-body>
        @if (asked()) {
            <div class="register-sent">
                <p class="register-lead">{{ 'account.reset.asked' | translate }}</p>
                <p class="register-note">{{ 'account.reset.askedNote' | translate }}</p>
            </div>
        } @else {
            <form class="d-flex flex-col flex-wrap gap-3">
                <p class="register-note">{{ 'account.reset.lead' | translate }}</p>

                <app-text
                    [label]="'login.email' | translate"
                    [placeholder]="'login.emailPlaceholder' | translate"
                    [(value)]="form().email"
                    [required]="true"
                    autocomplete="email"
                ></app-text>
            </form>
        }
    </div>

    <div modal-footer class="d-flex gap-3 justify-content-end">
        @if (asked()) {
            <app-button [text]="'common.close' | translate" variant="primary" (buttonClick)="cancel()"></app-button>
        } @else {
            <app-button [text]="'common.cancel' | translate" variant="secondary" (buttonClick)="cancel()"></app-button>
            <app-button [text]="'account.reset.action' | translate" variant="primary" (buttonClick)="ask()"></app-button>
        }
    </div>
</app-modal>

<app-loader [loading]="loading()"></app-loader>
