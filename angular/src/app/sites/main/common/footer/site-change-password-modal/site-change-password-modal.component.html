<app-modal [title]="title() | translate" [dismissable]="!forced()" (closeModal)="closeModal()">
    <div modal-body>
        <form class="d-flex flex-col flex-wrap gap-3">
            <p class="register-note">{{ (forced() ? 'account.methods.mustChangeLead' : 'account.methods.changePasswordLead') | translate }}</p>

            <app-password
                [label]="'account.methods.currentPassword' | translate"
                [(value)]="form().current"
                [required]="true"
                autocomplete="current-password"
            ></app-password>

            <app-password
                [label]="'account.reset.newPassword' | translate"
                [description]="'account.register.passwordHint' | translate: { count: passwordMin }"
                [(value)]="form().password"
                [required]="true"
                autocomplete="new-password"
            ></app-password>

            <app-password
                [label]="'account.register.passwordAgain' | translate"
                [(value)]="form().passwordAgain"
                [required]="true"
                autocomplete="new-password"
            ></app-password>

            <!-- Said before it happens rather than after. Somebody changing a
                 password on a laptop they also use elsewhere should know that
                 the elsewhere is about to stop working. -->
            <p class="text-muted small">{{ 'account.methods.changePasswordNote' | translate }}</p>

            @if (refusal(); as refusal) {
                <p class="register-problem">
                    @if (refusalIsKey()) {
                        {{ refusal | translate }}
                    } @else {
                        {{ refusal }}
                    }
                </p>
            }
        </form>
    </div>

    <div modal-footer class="d-flex gap-3 justify-content-end">
        @if (forced()) {
            <!-- Not a cancel: there is nothing to go back to. The way out of a
                 password you cannot change is to stop being signed in. -->
            <app-button [text]="'common.logout' | translate" variant="secondary" [outline]="true" (buttonClick)="signOut()"></app-button>
        } @else {
            <app-button [text]="'common.cancel' | translate" variant="secondary" (buttonClick)="cancel()"></app-button>
        }
        <app-button [text]="'account.reset.saveAction' | translate" variant="primary" (buttonClick)="save()"></app-button>
    </div>
</app-modal>

<app-loader [loading]="loading()"></app-loader>
