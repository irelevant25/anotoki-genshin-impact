<div class="container">
    <div style="min-height: 250px; position: relative">
        <app-loader [loading]="loading()"></app-loader>

        <div class="px-5 py-2" v-if="!isLoading">
            <div class="d-flex flex-wrap gap-2 justify-content-center py-3">
                <div class="filter-bar">
                    <app-dropdown [label]="'Version'" [options]="versionOptions()" [(value)]="filterVersions" [emptyOption]="true" [emptyOptionText]="'— any —'"></app-dropdown>
                    <app-text [label]="'Character Name'" [placeholder]="'contains'" [(value)]="filterCharacterName"></app-text>
                    <app-button text="Reset" variant="secondary" [outline]="true" size="small" (buttonClick)="resetFilters()"></app-button>
                </div>
            </div>

            <div class="d-flex flex-column gap-2 py-3">
                @for (banner of banners(); track banner.id) {
                    <div class="wish-card-container-wrapper gap-2 flex-column w-100">
                        <div class="wish-card-container gap-1 flex-row flex-column-mobile">
                            <div class="align-content-center m-auto-mobile w-auto-mobile" style="width: 25px; min-width: 25px">{{ banner.version }}</div>
                            <div class="align-content-center m-auto-mobile w-auto-mobile" style="width: 150px; min-width: 150px">{{ banner.duration_from }} - {{ banner.duration_to }}</div>
                            <img [appMaterialIcon]="banner.icon_name" [appAssetFolder]="'banners'" [alt]="banner.name" class="my-auto mx-auto-mobile" style="width: 355px; min-width: 355px" />
                            <div class="d-flex flex-row flex-wrap gap-2 m-auto-mobile">
                                @for (character of banner.characters; track character.id) {
                                    <div class="card-container">
                                        <div class="d-flex flex-column item-card">
                                            <img
                                                [appMaterialIcon]="character.icon_name"
                                                [appAssetFolder]="'character.icon'"
                                                [alt]="character.name"
                                                class="top-border"
                                                loading="lazy"
                                                [class]="'quality-' + (character.rarity ?? '0')"
                                            />
                                            <div class="name text-center bottom-border py-1">{{ character.name }}</div>
                                        </div>
                                    </div>
                                }
                                @for (weapon of banner.weapons; track weapon.id) {
                                    <div class="card-container">
                                        <div class="d-flex flex-column item-card">
                                            <img
                                                [appMaterialIcon]="weapon.icon_name"
                                                [appAssetFolder]="'weapons'"
                                                [alt]="weapon.name"
                                                class="top-border"
                                                loading="lazy"
                                                [class]="'quality-' + (weapon.rarity ?? '0')"
                                            />
                                            <div class="name text-center bottom-border py-1">{{ weapon.name }}</div>
                                        </div>
                                    </div>
                                }
                            </div>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
