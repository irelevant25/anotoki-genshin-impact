<div class="container w-100">
    <app-loader #loader [loading]="loading()"></app-loader>

    @if (!loader.loadingCtrl.loading()) {
        <app-quiz-frame
            [difficulty]="difficultyString()"
            [isDaily]="isDaily()"
            [isQuestionComplete]="isQuestionComplete()"
            [tries]="displayTries()"
            [triesCount]="tries().length"
            [triesMax]="triesMax()"
            [options]="searchOptions()"
            [answer]="questionEntity()"
            (guess)="guess($event)"
            (next)="next()"
        >
            <!-- A canvas rather than an image with a filter: CSS has no way to
                 draw hard-edged blocks, and blurring is a different puzzle. -->
            <canvas #canvas class="quiz-question-canvas"></canvas>
        </app-quiz-frame>
    }
</div>
