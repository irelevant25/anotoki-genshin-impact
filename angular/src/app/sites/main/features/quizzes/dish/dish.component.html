<div class="container w-100">
    <app-loader #loader [loading]="loading()"></app-loader>

    @if (!loader.loadingCtrl.loading()) {
        <app-quiz-frame
            [difficulty]="difficultyString()"
            [isDaily]="isDaily()"
            [isQuestionComplete]="isQuestionComplete()"
            [tries]="displayTries()"
            [triesCount]="tries().length"
            [triesMax]="triesMax()"
            [options]="searchOptions()"
            [answer]="questionEntity()"
            (guess)="guess($event)"
            (next)="next()"
        >
            @if (questionEntity()?.dish; as dish) {
                <div class="dish">
                    <!-- The food art is filed under the dish's own name, not the
                         upper-cased icon name the character tables use. -->
                    <img class="quiz-question-image" [class]="effectClasses()" [appMaterialIcon]="dish.name" [appAssetFolder]="'foods'" alt="" loading="eager" />

                    @if (isQuestionComplete()) {
                        <p class="dish-name">{{ dish.name }}</p>
                    }
                </div>
            }
        </app-quiz-frame>
    }
</div>
