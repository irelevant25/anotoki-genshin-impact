@if (!hidden()) {
    <div class="form-field" [class]="class()">
        @if (label()) {
            <label #labelElement [for]="inputId" class="password-label" (mouseenter)="mouseEnter()" (mouseleave)="mouseLeave()">
                {{ label() }}
                @if (required()) {
                    <span class="required-indicator">*</span>
                }
                @if (tooltipText()) {
                    <span #tooltipElement class="tooltip-icon">ⓘ</span>
                }
            </label>
        }

        <div class="password-input-wrapper" [class.has-error]="hasError()" [class.is-focused]="isFocused()" [class.is-disabled]="disabled()">
            <input
                #inputElement
                [id]="inputId"
                [type]="isPasswordVisible() ? 'text' : 'password'"
                [placeholder]="placeholder() ?? ''"
                [disabled]="disabled()"
                [value]="computedValue()"
                (input)="onInput($event)"
                (blur)="onBlur($event)"
                (focus)="onFocus($event)"
                class="form-control password-input"
                autocomplete="current-password"
            />

            @if (showToggle()) {
                <button type="button" class="toggle-visibility-btn" (click)="togglePasswordVisibility()" [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'" tabindex="-1">
                    @if (isPasswordVisible()) {
                        <i class="icon icon-eye-slash"></i>
                    } @else {
                        <i class="icon icon-eye"></i>
                    }
                </button>
            }
        </div>

        @if (description()) {
            <span class="password-description">{{ description() }}</span>
        }

        @if (displayError() && hasError()) {
            <div class="error-message" [id]="inputId + '-error'" role="alert" aria-live="polite">
                {{ errorMessage() }}
            </div>
        }
    </div>
}
