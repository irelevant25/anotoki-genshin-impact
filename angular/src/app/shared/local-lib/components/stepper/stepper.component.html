@if (!hidden()) {
    <div class="stepper-container" [class]="containerClass()" [style.width]="width()">
        <!-- Header with step indicators -->
        <div class="stepper-header">
            <div class="steps-wrapper">
                @for (stepItem of steps; track stepItem; let i = $index) {
                    <div class="step-item">
                        <div class="step-circle" [class.active]="stepItem === step()" [class.completed]="stepItem.completed">
                            <span>{{ i + 1 }}</span>
                        </div>
                        <div class="step-label" [class.active]="stepItem === step()" [class.completed]="stepItem.completed">
                            {{ stepItem.title }}
                        </div>
                        @if (i < steps.length - 1) {
                            <div class="step-connector" [class.completed]="stepItem.completed"></div>
                        }
                    </div>
                }
            </div>
        </div>

        <div [class]="contentClass()">
            <!-- Content area -->
            <div class="stepper-content">
                @if (step()) {
                    <div class="step-content">
                        <ng-container *ngTemplateOutlet="step()?.component?.template ?? null"></ng-container>
                    </div>
                }
            </div>

            <!-- Navigation buttons -->
            <div class="stepper-actions">
                @if (step()?.backButton) {
                    <app-button text="Späť" variant="secondary" (buttonClick)="goBack()"></app-button>
                }
                @if (step()?.nextButton) {
                    <app-button text="Ďalej" variant="primary" (buttonClick)="goNext()"></app-button>
                }
                @if (step()?.completeButton) {
                    <app-button text="Potvrdiť" variant="primary" (buttonClick)="complete()"></app-button>
                }
            </div>
        </div>
    </div>
}
