<div class="modal-content" [class]="class()">
    <div class="modal-header">
        @if (title()) {
            <h2>
                {{ title() }}
            </h2>
        }
        <app-button class="p-0 ms-5" icon="icon-close" variant="secondary" [outline]="true" tooltipText="Zatvoriť" (buttonClick)="closeDialog()"></app-button>
    </div>
    @if (subtitle()) {
        <p class="modal-subtitle text-muted mb-3">
            {{ subtitle() }}
        </p>
    }
    <div class="modal-body">
        <ng-content select="[modal-body]"></ng-content>
    </div>
    <div class="modal-footer">
        <ng-content select="[modal-footer]"></ng-content>
    </div>
</div>
