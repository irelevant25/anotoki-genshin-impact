@if (!hidden()) {
    <fieldset [class.group]="isGroup()">
        @if (isGroup()) {
            <legend class="form-label">Požadované termíny</legend>
        }
        <div class="container-wrap">
            <div class="container-wrap d-grid gap-3" [class]="class() + (cols() ? ' cols-' + cols() : '')">
                <ng-content></ng-content>
            </div>
        </div>
    </fieldset>
}
